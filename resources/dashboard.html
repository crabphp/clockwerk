<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Clockwerk</title>
<style>
/* CrabPHP design system: a terminal-shaped dashboard, not an application shell. */
:root,
:root[data-theme="light"],
:root[data-theme="dark"],
:root:not([data-theme="light"]) {
    --bg: #111111;
    --surface: rgba(255, 255, 255, .045);
    --raised: #111111;
    --line: rgba(255, 255, 255, .16);
    --line-soft: rgba(255, 255, 255, .08);
    --text: rgba(255, 255, 255, .88);
    --strong: #ffffff;
    --muted: rgba(255, 255, 255, .62);
    --faint: rgba(255, 255, 255, .5);
    --accent: #f5b800;
    --accent-soft: rgba(245, 184, 0, .12);
    --accent-text: #f5b800;
    --ok: #f5b800;
    --ok-soft: rgba(245, 184, 0, .12);
    --warn: #f5b800;
    --warn-soft: rgba(245, 184, 0, .12);
    --bad: #f5b800;
    --bad-soft: rgba(245, 184, 0, .12);
    --bar: rgba(255, 255, 255, .62);
    --bar-soft: rgba(255, 255, 255, .22);
    --shadow: none;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: var(--mono);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/21px var(--mono); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono, pre { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

.skip-link { position: absolute; left: 16px; top: -50px; z-index: 30; padding: 4px 8px; background: var(--bg); }
.skip-link:focus { top: 16px; }
.shell { display: block; min-height: 100%; }
.side { position: static; display: block; width: min(1160px, calc(100% - 80px)); height: auto; padding: 40px 40px 0; background: var(--bg); }
.brand { display: block; padding: 0; margin: 0 0 21px; }
.brand svg, .nav a svg { display: none; }
.brand b { display: inline; color: var(--strong); font-size: 13px; font-weight: 700; line-height: 21px; text-transform: lowercase; }
.brand b::after { content: "."; color: var(--accent); }
.brand span { display: inline; margin-left: 14px; max-width: none; color: var(--muted); font-size: 13px; }
.nav { display: flex; flex-wrap: wrap; gap: 0 21px; padding: 0 0 21px; border-bottom: 1px solid var(--line-soft); }
.nav a { display: block; padding: 0; border: 0; border-radius: 0; color: var(--muted); font-weight: 400; }
.nav a:hover { background: none; color: var(--strong); }
.nav a.on { background: none; color: var(--accent); box-shadow: none; outline: 0; }
.nav a.on::before { content: "> "; color: var(--accent); }
.nav .count { min-width: 0; margin-left: 6px; padding: 0; border-radius: 0; background: none; color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; }
.nav .count.bad { background: none; color: inherit; }
.side-foot { margin-top: 21px; padding: 0; border: 0; color: var(--muted); font-size: 13px; }
.when { margin-left: auto; }
.live { display: flex; align-items: center; gap: 8px; }
.dot { width: 6px; height: 6px; border-radius: 0; background: var(--accent); box-shadow: none; flex: none; }
.dot.paused, .dot.down { background: var(--accent); box-shadow: none; }
.dot.pulse { animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }

.main { width: min(1160px, calc(100% - 80px)); min-width: 0; padding: 0 40px 84px; }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 42px 0 21px; background: var(--bg); }
.top h1, h1 { margin: 0; color: var(--strong); font-size: 13px; line-height: 21px; font-weight: 700; text-transform: uppercase; }
h1::before { content: "# "; color: var(--faint); }
.top .sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.seg { display: flex; gap: 14px; padding: 0; border: 0; border-radius: 0; background: none; }
.seg button, .text-btn { min-height: 28px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 400; }
.seg button:hover, .text-btn:hover { color: var(--strong); }
.seg button.on { background: none; color: var(--accent); box-shadow: none; }
.seg button.on::before { content: "> "; }
.icon-btn { width: auto; height: 28px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--muted); }
.icon-btn svg { display: none; }
.icon-btn::after { content: "pause"; }

.grid { display: block; }
.grid > * + * { margin-top: 21px; }
.cards > a { display: block; min-width: 0; }
.card { min-width: 0; background: none; border: 0; border-radius: 0; box-shadow: none; }
.card > header { display: flex; align-items: baseline; gap: 8px; padding: 0; margin-bottom: 21px; }
.card > header h2, h2 { margin: 0; color: var(--strong); font-size: 13px; line-height: 21px; font-weight: 700; text-transform: uppercase; }
h2::before { content: "## "; color: var(--faint); }
.card > header .hint { color: var(--muted); font-size: 13px; }
.card > header .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; justify-content: flex-end; }
.card .body { padding: 0; }
.stat { padding: 0 0 21px; }
.stat .label { color: var(--muted); font-size: 13px; font-weight: 400; }
.stat .value { margin-top: 0; color: var(--strong); font-size: 13px; font-weight: 700; letter-spacing: 0; line-height: 21px; }
.stat .value small { margin-left: 3px; color: var(--muted); font-size: 13px; font-weight: 400; letter-spacing: 0; }
.stat .foot { min-height: 21px; margin-top: 0; color: var(--muted); font-size: 13px; }
.stat svg.spark { display: block; width: 100%; max-width: 320px; height: 21px; margin-top: 0; }
.section { margin-top: 42px; }

.chart { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 150px auto; column-gap: 10px; row-gap: 6px; }
.chart .plot { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart .grid-line { stroke: var(--line-soft); stroke-width: 1; }
.chart .y, .chart .x { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .y { flex-direction: column; text-align: right; line-height: 1; margin: -5px 0; }
.chart .x { grid-column: 2; }
.chart rect.ok { fill: var(--bar-soft); }
.chart rect.err { fill: var(--accent); }
.chart rect.hit { fill: transparent; }
.chart g.col:hover rect.hit { fill: var(--accent-soft); }
.tip { position: absolute; z-index: 4; pointer-events: none; padding: 0 0 0 8px; border-left: 1px solid var(--accent); background: var(--bg); color: var(--strong); font-size: 12px; line-height: 21px; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 700; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
.legend i { display: inline-block; width: 9px; height: 1px; margin-right: 6px; vertical-align: middle; background: var(--bar-soft); }
.legend i.err { background: var(--accent); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 0 21px 0 0; text-align: left; white-space: nowrap; vertical-align: top; }
th { height: 42px; color: var(--faint); font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; user-select: none; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--strong); }
th .arrow { display: inline-block; width: 10px; color: var(--accent); }
td { height: 42px; }
td.r, th.r { text-align: right; padding-right: 0; }
td.name { white-space: normal; word-break: break-word; min-width: 180px; }
tbody tr.row:hover { background: none; color: var(--accent); }
tr.expandable { cursor: pointer; }
tr.detail > td { height: auto; padding: 21px 21px 21px 0; background: var(--surface); white-space: normal; }
.share { display: inline-block; width: 64px; height: 1px; border-radius: 0; background: var(--line-soft); vertical-align: middle; margin-left: 10px; overflow: hidden; }
.share i { display: block; height: 100%; background: var(--bar-soft); border-radius: 0; }
.method { display: inline; min-width: 0; margin-right: 8px; padding: 0; border-radius: 0; background: none; color: var(--accent); font: 700 13px/21px var(--mono); text-align: left; }
.method.GET, .method.POST, .method.PUT, .method.PATCH, .method.DELETE { background: none; color: var(--accent); }

.pill { display: inline; padding: 0; border-radius: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 21px; }
.pill::before { display: none; }
.pill.ok, .pill.warn, .pill.bad { background: none; color: var(--accent); }
.chip { display: inline; padding: 0; border-radius: 0; background: none; color: var(--faint); font: 13px/21px var(--mono); margin: 0 14px 0 0; }
.bad-text, .warn-text, .ok-text { color: var(--accent); font-weight: 700; }

.btn { min-height: 28px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 400; }
.btn:hover { border: 0; color: var(--strong); text-decoration: underline; }
.btn.primary { background: var(--accent); color: var(--bg); padding: 0 8px; }
.btn.danger:hover { border: 0; color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.search { width: 220px; max-width: 100%; padding: 0 0 2px; border: 0; border-bottom: 1px solid var(--faint); border-radius: 0; background: none; outline: none; }
.search:focus { border-color: var(--accent); box-shadow: none; }

.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: baseline; gap: 10px; min-width: 0; padding: 0 0 8px; border: 0; }
.list li:last-child { padding-bottom: 0; }
.list .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 0; color: var(--muted); text-align: left; }
.loading { padding-top: 20vh; }
.queue-total { min-width: 36px; text-align: right; }
.worker-memory { min-width: 64px; text-align: right; }
.empty b { display: block; margin-bottom: 0; color: var(--strong); font-weight: 700; }
.empty code, p code { padding: 0; border-radius: 0; background: none; color: var(--strong); font-family: var(--mono); font-size: 13px; }
pre { margin: 0; padding: 21px; background: var(--surface); color: var(--muted); white-space: pre-wrap; word-break: break-word; }
pre b { color: var(--strong); font-weight: 700; }
.kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 0 14px; margin-bottom: 21px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.sup { padding: 0; }
.sup h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
.sup .meta { display: flex; gap: 16px; margin-top: 10px; color: var(--muted); font-size: 13px; }
.sup .meta b { color: var(--strong); font-weight: 700; }
.toast { position: fixed; right: 16px; bottom: 16px; z-index: 20; padding: 0 8px; border-left: 1px solid var(--accent); background: var(--bg); color: var(--accent); font-size: 13px; }
.gate { max-width: 680px; margin: 42px 0 0; padding: 0; }
.gate h2 { margin: 0 0 21px; font-size: 13px; }
.gate form { display: flex; gap: 14px; margin-top: 21px; }
.gate input { flex: 1; }
.verdict { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 21px; padding: 0 0 0 12px; border: 0; border-left: 1px solid var(--accent); border-radius: 0; background: none; line-height: 21px; }
.verdict .dot { margin-top: 8px; }
.verdict.ok, .verdict.warn, .verdict.bad { border-color: var(--accent); background: none; }
.verdict code { padding: 0; border-radius: 0; background: none; font-family: var(--mono); font-size: 13px; }
.subnav { display: flex; gap: 21px; margin: 0 0 21px; padding-bottom: 0; border: 0; overflow-x: auto; }
.subnav a { display: block; padding: 0; margin: 0; border: 0; color: var(--muted); font-weight: 400; white-space: nowrap; }
.subnav a:hover { color: var(--strong); }
.subnav a.on { color: var(--accent); border: 0; }
.subnav a.on::before { content: "> "; }
.subnav .count { min-width: 0; padding: 0; border-radius: 0; background: none; color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; }
.subnav .count.bad { background: none; color: inherit; }
.cards > a:hover .card { border: 0; }
.banner { margin-bottom: 21px; padding: 0 0 0 12px; border: 0; border-left: 1px solid var(--accent); border-radius: 0; background: none; color: var(--accent); font-weight: 400; }
.more { margin-top: 21px; padding-top: 21px; color: var(--muted); }

@media (max-width: 860px) {
    .side, .main { width: 100%; }
    .side { padding: 24px 16px 0; }
    .main { padding: 0 16px 64px; }
    .top { padding-top: 24px; }
    .card > header .right { margin-left: 0; }
}
@media (max-width: 560px) {
    body { font-size: 14px; line-height: 22px; }
    .mono, pre, .empty code, p code { font-size: 13px; }
    .brand span, .nav a, .side-foot, .top .sub, .seg button, .text-btn, .btn, .search { font-size: 14px; }
    .top { gap: 8px; padding-top: 22px; }
    .top .spacer { display: none; }
    .seg { width: 100%; justify-content: space-between; }
    th, td { padding-right: 16px; }
    .table-wrap { margin-right: -16px; }
    .gate form { align-items: stretch; flex-direction: column; }
    .gate .btn { align-self: flex-start; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';

const base = location.pathname.replace(/\/+$/, '');
const pages = [
    ['overview', 'Overview'],
    ['requests', 'Requests'],
    ['queue', 'Queue'],
    ['schedule', 'Schedule'],
    ['workers', 'Workers'],
    ['exceptions', 'Exceptions'],
];
const ranges = [[15, '15m'], [60, '1h'], [360, '6h'], [1440, '24h']];
// The parts of the queue page, and the ones that list the jobs standing in a state.
const queueTabs = ['overview', 'pending', 'processing', 'delayed', 'recent', 'failed'];
const listed = ['pending', 'processing', 'delayed'];

const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem('clockwerk.' + key)) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem('clockwerk.' + key, JSON.stringify(value)); } catch {} },
};
const ui = {
    page: 'overview',
    minutes: store.get('minutes', 60),
    paused: false,
    state: null,
    error: null,
    gate: false,
    closed: false,
    fetchedAt: 0,
    sort: { requests: ['runs', -1], jobs: ['runs', -1] },
    filter: '',
    open: new Set(),
    shown: { failed: 25, exceptions: 25, recent: 25, listed: 25 },
    queueTab: 'overview',
    jobFilter: 'all',
    busy: false,
    toast: null,
};

// The token arrives once in the address and is kept for the tab, out of the address bar and the history.
const query = new URLSearchParams(location.search);
let token = null;
try { token = sessionStorage.getItem('clockwerk.token'); } catch {}
if (query.has('token')) {
    token = query.get('token');
    try { sessionStorage.setItem('clockwerk.token', token); } catch {}
    query.delete('token');
    history.replaceState(null, '', location.pathname + (query.size ? '?' + query : '') + location.hash);
}

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const int = (n) => Number(n || 0).toLocaleString('en-US');
const ms = (n) => { n = Number(n || 0); return n >= 10000 ? (n / 1000).toFixed(1) + ' s' : n >= 1000 ? (n / 1000).toFixed(2) + ' s' : n >= 100 ? Math.round(n) + ' ms' : n >= 10 ? n.toFixed(1) + ' ms' : n.toFixed(2) + ' ms'; };
const pct = (part, whole) => whole > 0 ? (100 * part / whole) : 0;
const pctText = (value) => value === 0 ? '0%' : value < 0.1 ? '<0.1%' : value.toFixed(value < 10 ? 1 : 0) + '%';
const bytes = (n) => n >= 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : (n / 1048576).toFixed(0) + ' MB';
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const stamp = (ts) => new Date(ts * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const span = (seconds) => {
    seconds = Math.max(0, Math.round(seconds));
    if (seconds < 60) { return seconds + 's'; }
    if (seconds < 3600) { return Math.floor(seconds / 60) + 'm'; }
    if (seconds < 86400) { return Math.floor(seconds / 3600) + 'h ' + Math.floor(seconds % 3600 / 60) + 'm'; }
    return Math.floor(seconds / 86400) + 'd ' + Math.floor(seconds % 86400 / 3600) + 'h';
};
const ago = (ts, now) => ts ? (now - ts < 5 ? 'just now' : span(now - ts) + ' ago') : 'never';
const until = (ts, now) => ts ? (ts - now < 60 ? 'in under a minute' : 'in ' + span(ts - now)) : '';
const short = (name) => String(name).split('\\').pop();

async function call(path, options = {}) {
    const headers = { Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) };
    const response = await fetch(base + path, { ...options, headers, cache: 'no-store' });
    if (response.status === 401 || response.status === 403) {
        let message = (await response.text()).trim();
        try { message = JSON.parse(message).error?.message || message; } catch {}
        const error = new Error(message);
        error.gate = true;
        // 403: the dashboard is closed to everyone, and no token would open it.
        error.closed = response.status === 403 && !options.method;
        throw error;
    }
    if (!response.ok) { throw new Error('The server answered ' + response.status + '.'); }
    return response.json();
}

let asked = 0;
let refreshing = false;
async function refresh() {
    // Answers may arrive out of order; only the answer to the latest question is kept.
    const mine = ++asked;
    refreshing = true;
    try {
        // The jobs of a state one by one are asked for only while that list is open.
        const list = ui.page === 'queue' && listed.includes(ui.queueTab) ? '&list=' + ui.queueTab : '';
        const state = await call('/api?minutes=' + ui.minutes + list);
        if (mine !== asked) { return; }
        ui.state = state;
        ui.error = null;
        ui.gate = false;
        ui.fetchedAt = Date.now();
    } catch (error) {
        if (mine !== asked) { return; }
        ui.gate = Boolean(error.gate);
        ui.closed = Boolean(error.closed);
        ui.error = error.message || 'The dashboard could not be reached.';
    } finally {
        if (mine === asked) { refreshing = false; }
    }
    render();
}

// One bar per minute, or per few minutes when the range is long, with empty minutes filled in.
function bins(series, since, minutes) {
    const size = Math.max(1, Math.ceil(minutes / 60)) * 60;
    const start = Math.floor(since / size) * size;
    const count = Math.ceil((since + minutes * 60 - start) / size);
    const out = Array.from({ length: count }, (_, i) => ({ at: start + i * size, runs: 0, errors: 0, total_ms: 0, size }));
    for (const point of series) {
        const bin = out[Math.floor((point.bucket - start) / size)];
        if (bin) { bin.runs += point.runs; bin.errors += point.errors; bin.total_ms += point.total_ms; }
    }
    return out;
}

function chart(data, unit) {
    // The bars stretch with the card; the labels are text beside them, which must not.
    const width = 720, height = 150;
    const peak = Math.max(1, ...data.map((d) => d.runs));
    const step = Math.pow(10, Math.floor(Math.log10(peak)));
    const ceiling = Math.ceil(peak / step) * step;
    const scale = (value) => height * (1 - value / ceiling);
    const band = width / data.length;
    const bar = Math.max(1.5, band * 0.68);
    const lines = [0, 0.5, 1].map((part) => `<line class="grid-line" x1="0" x2="${width}" y1="${scale(ceiling * part)}" y2="${scale(ceiling * part)}" vector-effect="non-scaling-stroke"/>`).join('');
    let columns = '';
    data.forEach((d, i) => {
        const x = i * band + (band - bar) / 2;
        const good = d.runs - d.errors;
        const yGood = scale(good), yAll = scale(d.runs);
        const label = `${clock(d.at)}${d.size > 60 ? '–' + clock(d.at + d.size) : ''}`;
        const tip = `<b>${label}</b><br>${int(d.runs)} ${unit}${d.errors ? ' · ' + int(d.errors) + ' failed' : ''}${d.runs ? '<br>' + ms(d.total_ms / d.runs) + ' average' : ''}`;
        columns += `<g class="col" data-tip="${esc(tip)}" data-x="${(x + bar / 2) / width}"><rect class="hit" x="${i * band}" y="0" width="${band}" height="${height}"/>`
            + (good > 0 ? `<rect class="ok" x="${x}" y="${yGood}" width="${bar}" height="${Math.max(1, height - yGood)}"/>` : '')
            + (d.errors > 0 ? `<rect class="err" x="${x}" y="${yAll}" width="${bar}" height="${Math.max(1.5, yGood - yAll)}"/>` : '')
            + '</g>';
    });
    const amount = (value) => value >= 1000 ? (value / 1000) + 'k' : String(Math.round(value));
    return `<div class="chart"><div class="y"><span>${amount(ceiling)}</span><span>${ceiling >= 2 ? amount(ceiling / 2) : ''}</span><span>0</span></div>
        <div class="plot"><svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${lines}${columns}</svg><div class="tip"></div></div>
        <div class="x"><span>${clock(data[0].at)}</span><span>${clock(data[Math.floor(data.length / 2)].at)}</span><span>${clock(data[data.length - 1].at)}</span></div></div>`;
}

function spark(data, key) {
    const values = data.map(key);
    const peak = Math.max(1e-9, ...values);
    const width = 200, height = 34;
    const points = values.map((v, i) => [(i / Math.max(1, values.length - 1)) * width, height - 3 - (v / peak) * (height - 8)]);
    const line = points.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
    return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><path d="${line} L${width} ${height} L0 ${height} Z" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

const empty = (title, text) => `<div class="empty"><b>${title}</b>${text}</div>`;
const card = (title, hint, body, right = '') => `<section class="card"><header><h2>${title}</h2>${hint ? `<span class="hint">${hint}</span>` : ''}${right ? `<span class="right">${right}</span>` : ''}</header>${body}</section>`;
const bare = (body, right = '') => `<section class="card">${right ? `<header><span class="right">${right}</span></header>` : ''}${body}</section>`;
const stat = (label, value, foot, extra = '') => `<section class="card stat"><div class="label">${label}</div><div class="value num">${value}</div><div class="foot">${foot}</div>${extra}</section>`;
const legend = '<span class="legend"><span><i></i>Succeeded</span><span><i class="err"></i>Failed</span></span>';
const routeName = (name) => { const at = name.indexOf(' '); return `<span class="method ${esc(name.slice(0, at))}">${esc(name.slice(0, at))}</span><span class="mono">${esc(name.slice(at + 1))}</span>`; };
const errorCell = (errors, runs) => errors ? `<span class="bad-text num">${int(errors)}</span> <span class="faint num">${pctText(pct(errors, runs))}</span>` : '<span class="faint">–</span>';

function sorted(rows, [key, direction]) {
    return [...rows].sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * direction);
}
function head(table, columns) {
    const [key, direction] = ui.sort[table];
    return '<tr>' + columns.map(([id, label, right]) => id
        ? `<th class="sortable${right ? ' r' : ''}" data-sort="${table}:${id}">${label}<span class="arrow">${key === id ? (direction < 0 ? '↓' : '↑') : ''}</span></th>`
        : `<th${right ? ' class="r"' : ''}>${label}</th>`).join('') + '</tr>';
}

function measuredTable(table, data, nameCell, noun) {
    const rows = sorted(data.rows.filter((row) => !ui.filter || row.name.toLowerCase().includes(ui.filter.toLowerCase())), ui.sort[table]);
    if (data.rows.length === 0) { return ''; }
    const body = rows.map((row) => `<tr class="row"><td class="name">${nameCell(row.name)}</td>
        <td class="r num">${int(row.runs)}<span class="share"><i style="width:${pct(row.runs, data.total)}%"></i></span></td>
        <td class="r num">${ms(row.avg_ms)}</td><td class="r num">${ms(row.max_ms)}</td>
        <td class="r">${errorCell(row.errors, row.runs)}</td><td class="r muted num">${ago(row.last + 60, Math.max(ui.state.now, row.last + 60))}</td></tr>`).join('');
    return `<div class="table-wrap"><table><thead>${head(table, [['name', noun], ['runs', 'Count', 1], ['avg_ms', 'Average', 1], ['max_ms', 'Slowest', 1], ['errors', 'Failed', 1], ['last', 'Last seen', 1]])}</thead><tbody>${body || `<tr><td colspan="6" class="muted">Nothing matches “${esc(ui.filter)}”.</td></tr>`}</tbody></table></div>`;
}

function overview(s) {
    const req = bins(s.requests.series, s.since, s.minutes), jobs = bins(s.jobs.series, s.since, s.minutes);
    const waiting = s.jobs.queues.reduce((sum, q) => sum + q.pending + q.delayed, 0);
    const running = s.jobs.queues.reduce((sum, q) => sum + q.processing, 0);
    const errorRate = pct(s.requests.errors, s.requests.total);
    const slowest = sorted(s.requests.rows.filter((r) => r.runs > 0), ['avg_ms', -1]).slice(0, 6);
    const groups = Object.create(null);
    for (const worker of s.workers) { (groups[worker.group_name] ??= []).push(worker); }
    return `<div class="grid cards">
        ${stat('Requests', int(s.requests.total), `${(s.requests.total / s.minutes).toFixed(s.requests.total / s.minutes < 10 ? 1 : 0)} a minute`, spark(req, (d) => d.runs))}
        ${stat('Average response', s.requests.total ? ms(s.requests.avg_ms).replace(/ (\w+)$/, '<small>$1</small>') : '–', s.requests.total ? `slowest ${ms(s.requests.max_ms)}` : 'no requests yet', spark(req, (d) => d.runs ? d.total_ms / d.runs : 0))}
        ${stat('Failed requests', `<span class="${errorRate >= 1 ? 'bad-text' : ''}">${pctText(errorRate)}</span>`, `${int(s.requests.errors)} of ${int(s.requests.total)} answered 5xx`, spark(req, (d) => d.errors))}
        ${stat('Jobs', int(s.jobs.total), s.jobs.installed ? `${int(waiting)} pending · ${int(running)} running · <span class="${s.jobs.failed_total ? 'bad-text' : ''}">${int(s.jobs.failed_total)}${s.jobs.failed_more ? '+' : ''} failed for good</span>` : 'no queue registered', spark(jobs, (d) => d.runs))}
    </div>
    <div class="grid two section">
        ${card('Requests', 'by time', `<div class="body">${chart(req, 'requests')}</div>`, legend)}
        ${card('Jobs', 'tries, by time', `<div class="body">${chart(jobs, 'tries')}</div>`, legend)}
    </div>
    <div class="grid three section">
        ${card('Slowest routes', 'by average', slowest.length ? `<ul class="list">${slowest.map((r) => `<li><span class="grow">${routeName(r.name)}</span><span class="num">${ms(r.avg_ms)}</span></li>`).join('')}</ul>` : empty('No requests yet', 'They appear here within a few seconds of being answered.'))}
        ${card('Queues', 'pending now', s.jobs.installed ? `<ul class="list">${s.jobs.queues.map((q) => `<li><span class="grow mono">${esc(q.name)}</span><span class="muted num">${q.processing ? int(q.processing) + ' running' : ''}${q.longest_wait >= 60 ? ' · waited ' + span(q.longest_wait) : ''}</span><span class="num ${q.pending + q.delayed > 0 ? '' : 'faint'}" class="queue-total">${int(q.pending + q.delayed)}</span></li>`).join('')}</ul>` : empty('No queue', 'Register <code>QueuePlugin</code> to see it here.'))}
        ${card('Workers', `${s.workers.length} alive`, Object.keys(groups).length ? `<ul class="list">${Object.entries(groups).map(([group, workers]) => `<li><span class="dot"></span><span class="grow mono">${esc(group)}</span><span class="num">${workers.length}</span><span class="muted num" class="worker-memory">${bytes(workers.reduce((sum, w) => sum + w.memory, 0))}</span></li>`).join('')}</ul>` : empty('No worker heard from', 'Start <code>php cua start</code>.'))}
    </div>
    <div class="section">${card('Latest exceptions', '', exceptionRows(s, s.exceptions.slice(0, 5), 'o'), `<a class="btn" href="#exceptions">All ${s.exceptions.length}</a>`)}</div>`;
}

function requests(s) {
    const data = bins(s.requests.series, s.since, s.minutes);
    return `${card('Requests', `${int(s.requests.total)} in all`, `<div class="body">${chart(data, 'requests')}</div>`, legend)}
    <div class="section">${card('Routes', `${s.requests.rows.length}`, measuredTable('requests', s.requests, routeName, 'Route') || empty('No requests yet', 'Every request is counted by its route, within a few seconds of being answered.'), `<input class="search" type="search" placeholder="Filter routes" value="${esc(ui.filter)}" data-filter>`)}</div>`;
}

// Is the queue keeping up, and if not, where: one short line for each thing that is wrong.
function queueVerdict(s, alive) {
    const problems = [];
    const unserved = new Set();
    const of = (names, key) => names.reduce((sum, name) => sum + (s.jobs.queues.find((q) => q.name === name)?.[key] ?? 0), 0);
    for (const sup of s.jobs.supervisors) {
        const running = alive['queue:' + sup.name] || 0;
        if (running === 0) {
            sup.queues.forEach((name) => unserved.add(name));
            const stuck = of(sup.queues, 'pending') + of(sup.queues, 'processing');
            problems.push([stuck ? 'bad' : 'warn', `<b>${esc(sup.name)}</b> has no worker${stuck ? ` · ${int(stuck)} waiting` : ''}`]);
        } else if (running < sup.workers) {
            problems.push(['warn', `<b>${esc(sup.name)}</b> has ${running} of ${sup.workers} workers`]);
        }
    }
    if (!s.jobs.supervisors.length && !(alive.queue || 0) && s.jobs.queues.some((q) => q.pending || q.processing)) { problems.push(['bad', 'No worker is running']); }
    for (const q of s.jobs.queues) {
        if (q.pending + q.processing > 0 && s.jobs.supervisors.length && !s.jobs.supervisors.some((sup) => sup.queues.includes(q.name))) {
            unserved.add(q.name);
            problems.push(['bad', `<b>${esc(q.name)}</b> has no worker · ${int(q.pending + q.processing)} waiting`]);
        }
        if (q.longest_wait >= 60 && !unserved.has(q.name)) { problems.push([q.longest_wait >= 300 ? 'bad' : 'warn', `<b>${esc(q.name)}</b> is behind · oldest waited ${span(q.longest_wait)}`]); }
        const tries = q.completed + q.retried + q.failed;
        if (tries >= 10 && (q.retried + q.failed) / tries >= 0.25) { problems.push(['warn', `<b>${esc(q.name)}</b> · ${pctText(pct(q.retried + q.failed, tries))} of tries fail`]); }
    }
    if (s.jobs.failed_total) { problems.push(['warn', `<a href="#queue/failed">${int(s.jobs.failed_total)}${s.jobs.failed_more ? '+' : ''} failed</a>`]); }
    if (!problems.length) { return `<div class="verdict ok"><span class="dot"></span><div>Keeping up</div></div>`; }
    const worst = problems.some(([level]) => level === 'bad') ? 'bad' : 'warn';
    return `<div class="verdict ${worst}"><span class="dot ${worst === 'bad' ? 'down' : 'paused'}"></span><div>${problems.map(([, text]) => `<div>${text}</div>`).join('')}</div></div>`;
}

function queue(s) {
    if (!s.jobs.installed) { return `<section class="card">${empty('No queue', 'Register <code>QueuePlugin</code>.')}</section>`; }
    // "queue:mail" serves mail; one process doing the work of several is "queue:mail+default".
    const alive = Object.create(null);
    for (const worker of s.workers) {
        alive[worker.group_name] = (alive[worker.group_name] || 0) + 1;
        const names = worker.group_name.startsWith('queue:') ? worker.group_name.slice(6).split('+') : [];
        if (names.length > 1) { for (const name of names) { alive['queue:' + name] = (alive['queue:' + name] || 0) + 1; } }
    }
    // A supervisor named "queue" runs as the group of that name.
    if (alive.queue) { alive['queue:queue'] = (alive['queue:queue'] || 0) + alive.queue; }
    const sum = (key) => s.jobs.queues.reduce((total, q) => total + (q[key] || 0), 0);
    const completed = sum('completed');
    const counts = { pending: sum('pending'), processing: sum('processing'), delayed: sum('delayed'), failed: s.jobs.failed_total };
    const labels = { overview: 'Overview', pending: 'Pending', processing: 'Processing', delayed: 'Delayed', recent: 'Recent', failed: 'Failed' };
    const nav = `<nav class="subnav">${queueTabs.map((id) => `<a href="#queue/${id}" class="${ui.queueTab === id ? 'on' : ''}">${labels[id]}${counts[id] ? `<span class="count ${id === 'failed' ? 'bad' : ''}">${int(counts[id])}${id === 'failed' && s.jobs.failed_more ? '+' : ''}</span>` : ''}</a>`).join('')}</nav>`;
    const quiet = (n, strong = false) => n ? (strong ? `<b>${int(n)}</b>` : int(n)) : '<span class="faint">0</span>';
    const jobName = (job) => `<span class="mono" title="${esc(job.job)}">${esc(short(job.job))}</span>`;
    const table = (head, rows, list, total) => `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${more(list, total)}`;

    // Jobs standing in a state now, one by one.
    if (listed.includes(ui.queueTab)) {
        const state = ui.queueTab;
        const [heading, time] = {
            pending: ['Waiting', (job) => job.available_at ? span(s.now - job.available_at) : '–'],
            processing: ['Reservation age', (job) => job.reserved_at ? span(s.now - job.reserved_at) : '–'],
            delayed: ['Due in', (job) => job.available_at ? span(job.available_at - s.now) : '–'],
        }[state];
        // The list arrives with the answer after the tab is opened.
        if (s.jobs.list_state !== state) { return `${nav}<section class="card">${empty('Loading…', '')}</section>`; }
        const rows = s.jobs.list.slice(0, ui.shown.listed).map((job) => {
            const key = state[0] + job.id, open = ui.open.has(key);
            return `<tr class="row expandable" data-open="${esc(key)}"><td class="name">${jobName(job)}</td><td><span class="chip">${esc(job.queue)}</span></td><td class="r num">${quiet(job.attempts)}</td><td class="r num">${time(job)}</td></tr>`
                + (open ? `<tr class="detail"><td colspan="4"><dl class="kv"><dt>Job</dt><dd class="mono">${esc(job.job)}</dd><dt>Id</dt><dd class="mono">${esc(job.id)}</dd></dl><pre>${esc(JSON.stringify(job.data, null, 2))}</pre></td></tr>` : '');
        }).join('');
        const cut = counts[state] > s.jobs.list.length ? `<span class="muted">first ${s.jobs.list.length} of ${int(counts[state])}</span>` : '';
        return `${nav}${bare(rows ? table(`<th>Job</th><th>Queue</th><th class="r">Tries</th><th class="r">${heading}</th>`, rows, 'listed', s.jobs.list.length) : empty(`Nothing ${state === 'processing' ? 'running' : state}`, ''), cut)}`;
    }

    // The latest tries, with how each ended.
    if (ui.queueTab === 'recent') {
        const outcome = { completed: ['ok', 'Completed'], retrying: ['warn', 'Will retry'], failed: ['bad', 'Failed'] };
        const shown = s.jobs.recent.filter((job) => ui.jobFilter === 'all' || job.outcome === ui.jobFilter);
        const rows = shown.slice(0, ui.shown.recent).map((job) => {
            const key = 'j' + job.id + ':' + job.attempts + ':' + job.at, open = ui.open.has(key);
            return `<tr class="row expandable" data-open="${esc(key)}"><td class="name">${jobName(job)}${job.error ? `<div class="muted">${esc(job.error.slice(0, 110))}</div>` : ''}</td>
                <td><span class="chip">${esc(job.queue)}</span></td><td><span class="pill ${outcome[job.outcome]?.[0] || ''}">${outcome[job.outcome]?.[1] || esc(job.outcome)}</span></td>
                <td class="r num">${job.attempts}</td><td class="r num">${ms(job.ms)}</td><td class="r muted num">${ago(job.at, s.now)}</td></tr>`
                + (open ? `<tr class="detail"><td colspan="6"><dl class="kv"><dt>Job</dt><dd class="mono">${esc(job.job)}</dd><dt>Id</dt><dd class="mono">${esc(job.id)}</dd>${job.error ? `<dt>Error</dt><dd>${esc(job.error)}</dd>` : ''}</dl></td></tr>` : '');
        }).join('');
        const filters = `<div class="seg">${[['all', 'All'], ['completed', 'Completed'], ['retrying', 'Will retry'], ['failed', 'Failed']].map(([id, label]) => `<button data-job-filter="${id}" class="${ui.jobFilter === id ? 'on' : ''}">${label}</button>`).join('')}</div>`;
        return `${nav}${bare(rows ? table('<th>Job</th><th>Queue</th><th>Outcome</th><th class="r">Try</th><th class="r">Took</th><th class="r">Ended</th>', rows, 'recent', shown.length) : empty('Nothing yet', ''), filters)}`;
    }

    // Given up on, kept until retried or forgotten.
    if (ui.queueTab === 'failed') {
        const rows = s.jobs.failed.slice(0, ui.shown.failed).map((job) => {
            const key = 'f' + job.id, open = ui.open.has(key);
            return `<tr class="row expandable" data-open="${esc(key)}"><td class="name">${jobName(job)}<div class="muted">${esc((job.error || '').slice(0, 110))}</div></td>
                <td><span class="chip">${esc(job.queue)}</span></td><td class="r num">${job.attempts}</td><td class="r muted num">${ago(job.failed_at, s.now)}</td>
                <td class="r"><button class="btn" data-job="retry:${esc(job.id)}">Retry</button> <button class="btn danger" data-job="forget:${esc(job.id)}">Forget</button></td></tr>`
                + (open ? `<tr class="detail"><td colspan="5"><dl class="kv"><dt>Job</dt><dd class="mono">${esc(job.job)}</dd><dt>Id</dt><dd class="mono">${esc(job.id)}</dd><dt>Error</dt><dd>${esc(job.error)}</dd></dl><pre>${esc(JSON.stringify(job.data, null, 2))}</pre></td></tr>` : '');
        }).join('');
        const actions = rows ? `<button class="btn" data-job="retry:all">Retry all</button><button class="btn danger" data-job="forget:all">Forget all</button>` : '';
        return `${nav}${bare(rows ? table('<th>Job</th><th>Queue</th><th class="r">Tries</th><th class="r">Failed</th><th></th>', rows, 'failed', s.jobs.failed.length) : empty('Nothing failed', ''), actions)}`;
    }

    // The queue as a whole.
    const serving = (name) => {
        if (!s.jobs.supervisors.length) { return alive.queue ? int(alive.queue) : '<span class="bad-text">0</span>'; }
        const running = s.jobs.supervisors.filter((sup) => sup.queues.includes(name)).reduce((total, sup) => total + (alive['queue:' + sup.name] || 0), 0);
        return running ? int(running) : '<span class="bad-text">0</span>';
    };
    const wait = (q) => q.longest_wait === null ? '<span class="faint">–</span>' : `<span class="${q.longest_wait >= 300 ? 'bad-text' : q.longest_wait >= 60 ? 'warn-text' : 'muted'}">${span(q.longest_wait)}</span>`;
    const queueRows = s.jobs.queues.map((q) => `<tr class="row"><td><span class="mono">${esc(q.name)}</span></td>
        <td class="r num">${quiet(q.pending, true)}</td><td class="r num">${quiet(q.processing)}</td><td class="r num">${quiet(q.delayed)}</td>
        <td class="r num">${quiet(q.completed)}</td><td class="r num">${q.failed ? `<span class="bad-text">${int(q.failed)}</span>` : quiet(0)}</td>
        <td class="r num">${wait(q)}</td><td class="r num">${serving(q.name)}</td></tr>`).join('');
    const supervisors = s.jobs.supervisors.map((sup) => {
        const running = alive['queue:' + sup.name] || 0;
        return `<li><span class="mono">${esc(sup.name)}</span><span class="grow">${sup.queues.map((q) => `<span class="chip">${esc(q)}</span>`).join('')}</span><span class="pill ${running >= sup.workers ? 'ok' : running ? 'warn' : 'bad'}">${running}/${sup.workers}</span></li>`;
    }).join('');
    return `${nav}${queueVerdict(s, alive)}
    <div class="grid cards">
        <a href="#queue/pending">${stat('Pending', int(counts.pending), counts.delayed ? `+${int(counts.delayed)} delayed` : '')}</a>
        <a href="#queue/processing">${stat('Processing', int(counts.processing), '')}</a>
        <a href="#queue/recent">${stat('Completed', int(completed), `${(completed / s.minutes).toFixed(completed / s.minutes < 10 ? 1 : 0)}/min`)}</a>
        <a href="#queue/failed">${stat('Failed', `<span class="${counts.failed ? 'bad-text' : ''}">${int(counts.failed)}${s.jobs.failed_more ? '+' : ''}</span>`, sum('retried') ? `${int(sum('retried'))} retried` : '')}</a>
    </div>
    <div class="grid two section">
        ${card('Queues', '', `<div class="table-wrap"><table><thead><tr><th>Queue</th><th class="r">Pending</th><th class="r">Processing</th><th class="r">Delayed</th><th class="r">Completed</th><th class="r">Failed</th><th class="r" title="How long the oldest pending job has waited">Wait</th><th class="r">Workers</th></tr></thead><tbody>${queueRows}</tbody></table></div>`)}
        ${supervisors ? card('Supervisors', '', `<ul class="list">${supervisors}</ul>`) : ''}
    </div>
    <div class="section">${card('Throughput', '', `<div class="body">${chart(bins(s.jobs.series, s.since, s.minutes), 'tries')}</div>`, legend)}</div>
    <div class="section">${card('Jobs', '', measuredTable('jobs', s.jobs, (name) => `<span class="mono" title="${esc(name)}">${esc(short(name))}</span>`, 'Job') || empty('Nothing yet', ''))}</div>`;
}

function schedule(s) {
    if (!s.tasks.installed) { return `<section class="card">${empty('No schedule', 'Register <code>SchedulePlugin</code> before <code>ClockwerkPlugin</code> to see scheduled tasks here.')}</section>`; }
    if (!s.tasks.rows.length) { return `<section class="card">${empty('Nothing is scheduled', 'Declare tasks on <code>Schedule</code> in your setup’s <code>register()</code>.')}</section>`; }
    const running = s.workers.some((w) => w.group_name === 'schedule');
    const rows = s.tasks.rows.map((task) => {
        const state = task.runs === 0 ? ['', 'Not run yet'] : task.errors === 0 ? ['ok', 'Running well'] : task.errors === task.runs ? ['bad', 'Failing'] : ['warn', `${task.errors} failed`];
        return `<tr class="row"><td class="name"><span class="mono">${esc(task.name)}</span>${task.one_server ? ' <span class="chip">one server</span>' : ''}${task.without_overlapping ? ' <span class="chip">without overlapping</span>' : ''}</td>
            <td><span class="chip">${esc(task.when)}</span></td>
            <td class="muted num">${task.next_error ? `<span class="bad-text" title="${esc(task.next_error)}">No next run</span>` : task.next ? `${until(task.next, s.now)} <span class="faint">· ${stamp(task.next).replace(/:\d\d(?!.*:\d\d)/, '')}</span>` : 'while the scheduler runs'}</td>
            <td class="r num">${int(task.runs)}</td><td class="r num">${task.runs ? ms(task.avg_ms) : '<span class="faint">–</span>'}</td>
            <td class="r muted num">${task.last ? ago(task.last + 60, Math.max(s.now, task.last + 60)) : '<span class="faint">–</span>'}</td>
            <td class="r"><span class="pill ${state[0]}">${state[1]}</span></td></tr>`;
    }).join('');
    return `${running ? '' : '<div class="banner">No scheduler is running, so nothing here will run. Start <code>php cua start</code>, or <code>schedule:work</code> on its own.</div>'}
    ${card('Scheduled tasks', `${s.tasks.rows.length}`, `<div class="table-wrap"><table><thead><tr><th>Task</th><th>When</th><th>Next run</th><th class="r">Runs</th><th class="r">Average</th><th class="r">Last run</th><th class="r">State</th></tr></thead><tbody>${rows}</tbody></table></div>`)}`;
}

function workers(s) {
    if (!s.workers.length) { return `<section class="card">${empty('No worker heard from', 'A worker reports every few seconds once <code>php cua start</code>, <code>queue:work</code> or <code>schedule:work</code> is running.')}</section>`; }
    const groups = Object.create(null);
    for (const worker of s.workers) { (groups[worker.group_name] ??= []).push(worker); }
    return Object.entries(groups).map(([group, list], index) => `<div class="${index ? 'section' : ''}">${card(esc(group), `${list.length} ${list.length === 1 ? 'process' : 'processes'}`, `<div class="table-wrap"><table><thead><tr><th>Process</th><th>Host</th><th class="r">Up for</th><th class="r">Memory</th><th class="r">Handled</th><th class="r">Heard from</th></tr></thead><tbody>${list.map((w) => `<tr class="row"><td><span class="dot" style="display:inline-block;margin-right:10px"></span><span class="mono">${w.pid}</span></td><td class="muted">${esc(w.host)}</td><td class="r num">${span(s.now - w.started_at)}</td><td class="r num">${bytes(w.memory)}</td><td class="r num">${int(w.handled)}</td><td class="r muted num">${ago(w.seen_at, s.now)}</td></tr>`).join('')}</tbody></table></div>`)}</div>`).join('');
}

function exceptionRows(s, list, prefix) {
    if (!list.length) { return empty('No exceptions', 'What a request, a job or a task throws is kept here with where it came from.'); }
    return `<div class="table-wrap"><table><tbody>${list.map((e) => {
        const d = e.detail || {}, key = prefix + e.at + ':' + (d.class || '') + ':' + (d.during || '') + ':' + String(d.message ?? e.title).slice(0, 60), open = ui.open.has(key);
        return `<tr class="row expandable" data-open="${esc(key)}"><td class="name"><span class="bad-text mono">${esc(short(d.class || 'Error'))}</span> <span>${esc((d.message ?? e.title).slice(0, 160))}</span><div class="muted">${esc(d.during || '')}</div></td><td class="r muted num">${ago(e.at, s.now)}</td></tr>`
            + (open ? `<tr class="detail"><td colspan="2"><dl class="kv"><dt>Exception</dt><dd class="mono">${esc(d.class)}</dd><dt>Message</dt><dd>${esc(d.message)}</dd><dt>Thrown at</dt><dd class="mono">${esc(d.file)}:${esc(d.line)}</dd><dt>During</dt><dd>${esc(d.during)}</dd><dt>When</dt><dd>${stamp(e.at)}</dd></dl><pre>${(d.trace || []).map(esc).join('\n')}</pre></td></tr>` : '');
    }).join('')}</tbody></table></div>`;
}

function gate() {
    const content = ui.closed
        ? `<h2>The dashboard is closed</h2><p class="muted">${esc(ui.error).replace(/\n+/g, '<br>')}</p>`
        : `<h2>The dashboard needs its token</h2><p class="muted">It is the secret in <code>clockwerk.token</code>.${token ? ' The one this tab has was not accepted.' : ''}</p><form data-token><input class="search" type="password" placeholder="Token" autofocus><button class="btn primary">Open</button></form>`;
    return `<a class="skip-link" href="#main">Skip to content</a><main id="main" class="main"><h1>Clockwerk</h1><section class="gate">${content}</section></main>`;
}

const more = (list, total) => total > ui.shown[list] ? `<div class="more"><button class="btn" data-more="${list}">Show ${Math.min(25, total - ui.shown[list])} more</button> <span class="muted">${ui.shown[list]} of ${total} shown</span></div>` : '';
const views = { overview, requests, queue, schedule, workers, exceptions: (s) => card('Exceptions', `${s.exceptions.length}${s.exceptions.length >= 200 ? ', the latest' : ''}`, exceptionRows(s, s.exceptions.slice(0, ui.shown.exceptions), 'e') + more('exceptions', s.exceptions.length)) };

function render() {
    const app = document.getElementById('app');
    if (ui.gate) { app.innerHTML = gate(); return; }
    const s = ui.state;
    if (!s) { app.innerHTML = `<a class="skip-link" href="#main">Skip to content</a><main id="main" class="main"><h1>Clockwerk</h1><div class="empty loading">${ui.error ? `<b>The dashboard could not be reached</b>${esc(ui.error)}` : 'Loading…'}</div></main>`; return; }
    document.title = `${s.app} · Clockwerk`;
    const counts = { queue: s.jobs.failed_total, exceptions: s.exceptions.length };
    const [, title] = pages.find(([id]) => id === ui.page);
    const keep = document.activeElement?.matches?.('[data-filter]') ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    const scroll = window.scrollY;
    app.innerHTML = `<a class="skip-link" href="#main">Skip to content</a><div class="shell">
        <aside class="side">
            <div class="brand"><b>Clockwerk</b><span title="${esc(s.app)}">${esc(s.app)}</span></div>
            <nav class="nav">${pages.map(([id, label]) => `<a href="#${id}" class="${id === ui.page ? 'on' : ''}" title="${label}"><span class="label">${label}</span>${counts[id] ? `<span class="count ${id === 'queue' || id === 'exceptions' ? 'bad' : ''}">${counts[id] > 99 ? '99+' : counts[id]}</span>` : ''}</a>`).join('')}</nav>
            <div class="side-foot"><div class="live"><span class="dot ${ui.error ? 'down' : ui.paused ? 'paused' : 'pulse'}"></span><span>${ui.error ? 'Not reachable' : ui.paused ? 'Paused' : 'Live'}</span><span class="when faint">${clock(s.now)}</span></div></div>
        </aside>
        <main id="main" class="main">
            <div class="top"><h1>${title}</h1><span class="sub">the last ${ranges.find(([m]) => m === s.minutes)?.[1] ?? s.minutes + 'm'}</span><span class="spacer"></span>
                <div class="seg">${ranges.map(([m, label]) => `<button data-range="${m}" class="${m === ui.minutes ? 'on' : ''}">${label}</button>`).join('')}</div>
                <button class="text-btn" data-pause title="${ui.paused ? 'Resume' : 'Pause'}">${ui.paused ? 'Resume' : 'Pause'}</button>
            </div>
            ${ui.error ? `<div class="banner">${esc(ui.error)} Showing what was last received.</div>` : ''}
            ${views[ui.page](s)}
        </main>
    </div>${ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : ''}`;
    window.scrollTo(0, scroll);
    if (keep) { const input = app.querySelector('[data-filter]'); input?.focus(); input?.setSelectionRange(keep[0], keep[1]); }
}

function toast(text) {
    ui.toast = text;
    render();
    setTimeout(() => { if (ui.toast === text) { ui.toast = null; render(); } }, 2600);
}

document.addEventListener('click', async (event) => {
    const target = event.target.closest('[data-range], [data-pause], [data-sort], [data-job], [data-more], [data-job-filter], [data-open]');
    if (!target) { return; }
    if (target.dataset.jobFilter) { ui.jobFilter = target.dataset.jobFilter; ui.shown.recent = 25; render(); return; }
    if (target.dataset.more) { ui.shown[target.dataset.more] += 25; render(); return; }
    if (target.dataset.range) { ui.minutes = Number(target.dataset.range); store.set('minutes', ui.minutes); render(); refresh(); return; }
    if ('pause' in target.dataset) { ui.paused = !ui.paused; render(); if (!ui.paused) { refresh(); } return; }
    if (target.dataset.sort) {
        const [table, key] = target.dataset.sort.split(':');
        ui.sort[table] = [key, ui.sort[table][0] === key ? -ui.sort[table][1] : (key === 'name' ? 1 : -1)];
        render();
        return;
    }
    if (target.dataset.job) {
        event.stopPropagation();
        const at = target.dataset.job.indexOf(':'), action = target.dataset.job.slice(0, at), id = target.dataset.job.slice(at + 1);
        if (ui.busy || (id === 'all' && !confirm(action === 'retry' ? 'Put every failed job back on its queue?' : 'Delete every failed job? This cannot be undone.'))) { return; }
        ui.busy = true;
        try {
            const result = await call('/api/jobs/' + action, { method: 'POST', body: JSON.stringify({ id }) });
            const count = result.retried ?? result.forgotten ?? 0;
            toast(action === 'retry' ? `${count} ${count === 1 ? 'job' : 'jobs'} put back on the queue` : `${count} ${count === 1 ? 'job' : 'jobs'} forgotten`);
        } catch (error) { toast(error.message); }
        ui.busy = false;
        refresh();
        return;
    }
    if (target.dataset.open && !event.target.closest('button, a')) {
        ui.open.has(target.dataset.open) ? ui.open.delete(target.dataset.open) : ui.open.add(target.dataset.open);
        render();
    }
});
document.addEventListener('input', (event) => { if (event.target.matches('[data-filter]')) { ui.filter = event.target.value; render(); } });
document.addEventListener('submit', (event) => {
    if (!event.target.matches('[data-token]')) { return; }
    event.preventDefault();
    token = event.target.querySelector('input').value;
    try { sessionStorage.setItem('clockwerk.token', token); } catch {}
    refresh();
});
document.addEventListener('mousemove', (event) => {
    const column = event.target.closest?.('.chart g.col');
    for (const tip of document.querySelectorAll('.chart .tip')) {
        const mine = column && tip.parentElement.contains(column);
        tip.style.opacity = mine ? 1 : 0;
        if (mine) {
            tip.innerHTML = column.dataset.tip;
            const box = tip.parentElement.getBoundingClientRect(), half = tip.offsetWidth / 2;
            tip.style.left = Math.min(box.width - half, Math.max(half, Number(column.dataset.x) * box.width)) + 'px';
            tip.style.top = '-4px';
        }
    }
});
// The address says the page and, for the queue, which part of it: #queue/pending.
function route(first = false) {
    const [page, part] = location.hash.slice(1).split('/');
    if (!pages.some(([id]) => id === page)) { return; }
    const tab = page === 'queue' && queueTabs.includes(part) ? part : 'overview';
    const moved = page !== ui.page || tab !== ui.queueTab;
    if (page !== ui.page) { ui.filter = ''; }
    ui.page = page;
    ui.queueTab = tab;
    if (first || !moved) { return; }
    ui.shown.listed = 25;
    window.scrollTo(0, 0);
    render();
    // A list of jobs is not in what was last received: ask now, not at the next tick.
    if (page === 'queue' && listed.includes(tab)) { refresh(); }
}
window.addEventListener('hashchange', () => route());
route(true);

refresh();
// While the tab is in view and not paused; a chart being read is not redrawn under the pointer.
setInterval(() => {
    if (!refreshing && !ui.paused && !ui.gate && !document.hidden && !document.querySelector('.chart g.col:hover') && !ui.busy) { refresh(); }
}, 5000);
})();
</script>
</body>
</html>
