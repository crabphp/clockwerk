<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Clockwerk</title>
<style>
:root {
    --bg: #f6f5f2; --surface: #ffffff; --raised: #fbfaf8; --line: #e7e4de; --line-soft: #f0ede8;
    --text: #1d1b18; --muted: #6f6a62; --faint: #a39d93;
    --accent: #e0492f; --accent-soft: #fdebe6; --accent-text: #b93620;
    --ok: #1f9d61; --ok-soft: #e3f5ec; --warn: #b7791f; --warn-soft: #fcf1d9; --bad: #d23b3b; --bad-soft: #fde8e8;
    --bar: #2f2b26; --bar-soft: #d9d4cb; --shadow: 0 1px 2px rgba(29, 27, 24, .05), 0 1px 1px rgba(29, 27, 24, .03);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
}
:root[data-theme="dark"] {
    --bg: #131210; --surface: #1b1a17; --raised: #201f1b; --line: #2d2b26; --line-soft: #24221e;
    --text: #efece6; --muted: #a09a8f; --faint: #6d685f;
    --accent: #ff7052; --accent-soft: #3a1d15; --accent-text: #ff9179;
    --ok: #3ccf8a; --ok-soft: #12301f; --warn: #e3ad4a; --warn-soft: #33270f; --bad: #ff6b6b; --bad-soft: #3a1717;
    --bar: #e9e5dd; --bar-soft: #46423b; --shadow: none;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #131210; --surface: #1b1a17; --raised: #201f1b; --line: #2d2b26; --line-soft: #24221e;
        --text: #efece6; --muted: #a09a8f; --faint: #6d685f;
        --accent: #ff7052; --accent-soft: #3a1d15; --accent-text: #ff9179;
        --ok: #3ccf8a; --ok-soft: #12301f; --warn: #e3ad4a; --warn-soft: #33270f; --bad: #ff6b6b; --bad-soft: #3a1717;
        --bar: #e9e5dd; --bar-soft: #46423b; --shadow: none;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 14px 16px; border-right: 1px solid var(--line); background: var(--raised); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; line-height: 1.2; }
.brand span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav a svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: var(--line-soft); color: var(--text); }
.nav a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); outline: 1px solid var(--line); }
.nav a.on svg { color: var(--accent); }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--line-soft); color: var(--muted); font-size: 11.5px; font-weight: 600; text-align: center; line-height: 18px; }
.nav .count.bad { background: var(--bad-soft); color: var(--bad); }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.live { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
.dot.paused { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.dot.down { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.dot.pulse { animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }

.main { min-width: 0; padding: 0 32px 56px; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
.top h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; font-weight: 650; }
.top .sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--line-soft); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 4px 11px; border-radius: 6px; color: var(--muted); font-weight: 550; font-size: 13px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.icon-btn:hover { color: var(--text); }
.icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.grid { display: grid; gap: 16px; }
.cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 0; }
.card > header h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.card > header .hint { color: var(--muted); font-size: 12.5px; }
.card > header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card .body { padding: 12px 16px 16px; }
.stat { padding: 14px 16px 12px; }
.stat .label { color: var(--muted); font-size: 12.5px; font-weight: 550; display: flex; align-items: center; gap: 6px; }
.stat .value { margin-top: 4px; font-size: 27px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; }
.stat .value small { font-size: 14px; font-weight: 550; color: var(--muted); letter-spacing: 0; margin-left: 3px; }
.stat .foot { margin-top: 2px; font-size: 12.5px; color: var(--muted); min-height: 19px; }
.stat svg.spark { display: block; width: 100%; height: 34px; margin-top: 8px; }
.section { margin-top: 16px; }

.chart { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 150px auto; column-gap: 10px; row-gap: 6px; }
.chart .plot { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .y, .chart .x { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .y { flex-direction: column; text-align: right; line-height: 1; margin: -5px 0; }
.chart .x { grid-column: 2; }
.chart rect.ok { fill: var(--bar); }
.chart rect.err { fill: var(--bad); }
.chart rect.hit { fill: transparent; }
.chart g.col:hover rect.hit { fill: color-mix(in srgb, var(--text) 6%, transparent); }
.tip { position: absolute; z-index: 4; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.45; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--bar); }
.legend i.err { background: var(--bad); }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 16px; text-align: left; white-space: nowrap; }
th { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); user-select: none; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--text); }
th .arrow { display: inline-block; width: 10px; color: var(--accent); }
td { border-bottom: 1px solid var(--line-soft); }
tr:last-child > td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.name { white-space: normal; word-break: break-word; min-width: 180px; }
tbody tr.row:hover { background: var(--raised); }
tr.expandable { cursor: pointer; }
tr.detail > td { background: var(--raised); white-space: normal; padding: 14px 16px 16px; }
.table-wrap { overflow-x: auto; }
.share { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--line-soft); vertical-align: middle; margin-left: 10px; overflow: hidden; }
.share i { display: block; height: 100%; background: var(--bar-soft); border-radius: 3px; }
.method { display: inline-block; min-width: 44px; margin-right: 8px; padding: 1px 6px; border-radius: 5px; background: var(--line-soft); color: var(--muted); font: 600 11px/18px var(--mono); text-align: center; }
.method.GET { background: var(--ok-soft); color: var(--ok); }
.method.POST { background: var(--accent-soft); color: var(--accent-text); }
.method.PUT, .method.PATCH { background: var(--warn-soft); color: var(--warn); }
.method.DELETE { background: var(--bad-soft); color: var(--bad); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; line-height: 20px; background: var(--line-soft); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--line-soft); color: var(--muted); font: 500 12px/20px var(--mono); margin: 2px 4px 2px 0; }
.bad-text { color: var(--bad); font-weight: 600; }
.ok-text { color: var(--ok); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 550; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; width: 220px; max-width: 100%; outline: none; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line-soft); min-width: 0; }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 28px 16px 30px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
.empty code, p code { font-family: var(--mono); font-size: 12.5px; background: var(--line-soft); padding: 1px 6px; border-radius: 5px; }
pre { margin: 0; font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--muted); }
pre b { color: var(--text); font-weight: 600; }
.kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin-bottom: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.sup { padding: 14px 16px; }
.sup h3 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.sup .meta { display: flex; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.sup .meta b { color: var(--text); font-weight: 600; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 9px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 550; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }
.gate { max-width: 400px; margin: 14vh auto 0; padding: 26px; }
.gate h2 { margin: 0 0 6px; font-size: 18px; }
.gate form { display: flex; gap: 8px; margin-top: 16px; }
.gate input { flex: 1; }
.verdict { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); line-height: 1.55; }
.verdict .dot { margin-top: 7px; }
.verdict.ok { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.verdict.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 55%, var(--surface)); }
.verdict.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad-soft) 55%, var(--surface)); }
.verdict code { font-family: var(--mono); font-size: 12.5px; background: var(--line-soft); padding: 1px 6px; border-radius: 5px; }
.card > header .right { flex-wrap: wrap; justify-content: flex-end; }
.banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }

@media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 6px; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .brand { padding: 0 8px 0 2px; } .brand div { display: none; }
    .nav { flex-direction: row; } .nav a span.label { display: none; } .nav a { padding: 8px 10px; } .nav .count { margin-left: 2px; }
    .side-foot { margin: 0 0 0 auto; padding: 0 4px; border: 0; } .side-foot .when { display: none; }
    .main { padding: 0 16px 40px; } .two, .three { grid-template-columns: minmax(0, 1fr); }
    .top { position: static; padding-top: 14px; } .top .sub { display: none; }
}
@media (max-width: 520px) { .top { gap: 8px; } .seg button { padding: 4px 8px; } .cards { grid-template-columns: minmax(0, 1fr); } .stat .value { font-size: 24px; } th, td { padding: 8px 12px; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';

const base = location.pathname.replace(/\/+$/, '');
const pages = [
    ['overview', 'Overview', '<path d="M3 12l9-8 9 8"/><path d="M5 10v9h14v-9"/>'],
    ['requests', 'Requests', '<path d="M3 12h4l3-8 4 16 3-8h4"/>'],
    ['queue', 'Queue', '<rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="12" width="18" height="5" rx="1.5"/><path d="M7 20h10"/>'],
    ['schedule', 'Schedule', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
    ['workers', 'Workers', '<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M9 9h6v6H9z"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/>'],
    ['exceptions', 'Exceptions', '<path d="M12 3l10 17H2z"/><path d="M12 10v4M12 17.5v.5"/>'],
];
const ranges = [[15, '15m'], [60, '1h'], [360, '6h'], [1440, '24h']];

const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem('clockwerk.' + key)) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem('clockwerk.' + key, JSON.stringify(value)); } catch {} },
};
const ui = {
    page: pages.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : 'overview',
    minutes: store.get('minutes', 60),
    paused: false,
    state: null,
    error: null,
    gate: false,
    closed: false,
    fetchedAt: 0,
    sort: { requests: ['runs', -1], jobs: ['runs', -1] },
    filter: '',
    open: new Set(),
    shown: { failed: 15, exceptions: 25, recent: 25 },
    jobTab: 'recent',
    jobFilter: 'all',
    busy: false,
    toast: null,
};

// The token arrives once in the address and is kept for the tab, out of the address bar and the history.
const query = new URLSearchParams(location.search);
let token = null;
try { token = sessionStorage.getItem('clockwerk.token'); } catch {}
if (query.has('token')) {
    token = query.get('token');
    try { sessionStorage.setItem('clockwerk.token', token); } catch {}
    query.delete('token');
    history.replaceState(null, '', location.pathname + (query.size ? '?' + query : '') + location.hash);
}
const theme = store.get('theme', null);
if (theme) { document.documentElement.dataset.theme = theme; }

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const int = (n) => Number(n || 0).toLocaleString('en-US');
const ms = (n) => { n = Number(n || 0); return n >= 10000 ? (n / 1000).toFixed(1) + ' s' : n >= 1000 ? (n / 1000).toFixed(2) + ' s' : n >= 100 ? Math.round(n) + ' ms' : n >= 10 ? n.toFixed(1) + ' ms' : n.toFixed(2) + ' ms'; };
const pct = (part, whole) => whole > 0 ? (100 * part / whole) : 0;
const pctText = (value) => value === 0 ? '0%' : value < 0.1 ? '<0.1%' : value.toFixed(value < 10 ? 1 : 0) + '%';
const bytes = (n) => n >= 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : (n / 1048576).toFixed(0) + ' MB';
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const stamp = (ts) => new Date(ts * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const span = (seconds) => {
    seconds = Math.max(0, Math.round(seconds));
    if (seconds < 60) { return seconds + 's'; }
    if (seconds < 3600) { return Math.floor(seconds / 60) + 'm'; }
    if (seconds < 86400) { return Math.floor(seconds / 3600) + 'h ' + Math.floor(seconds % 3600 / 60) + 'm'; }
    return Math.floor(seconds / 86400) + 'd ' + Math.floor(seconds % 86400 / 3600) + 'h';
};
const ago = (ts, now) => ts ? (now - ts < 5 ? 'just now' : span(now - ts) + ' ago') : 'never';
const until = (ts, now) => ts ? (ts - now < 60 ? 'in under a minute' : 'in ' + span(ts - now)) : '';
const short = (name) => String(name).split('\\').pop();

async function call(path, options = {}) {
    const headers = { Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) };
    const response = await fetch(base + path, { ...options, headers, cache: 'no-store' });
    if (response.status === 401 || response.status === 403) {
        const error = new Error((await response.text()).trim());
        error.gate = true;
        // 403: the dashboard is closed to everyone, and no token would open it.
        error.closed = response.status === 403 && !options.method;
        throw error;
    }
    if (!response.ok) { throw new Error('The server answered ' + response.status + '.'); }
    return response.json();
}

async function refresh() {
    try {
        ui.state = await call('/api?minutes=' + ui.minutes);
        ui.error = null;
        ui.gate = false;
        ui.fetchedAt = Date.now();
    } catch (error) {
        ui.gate = Boolean(error.gate);
        ui.closed = Boolean(error.closed);
        ui.error = error.message || 'The dashboard could not be reached.';
    }
    render();
}

// One bar per minute, or per few minutes when the range is long, with empty minutes filled in.
function bins(series, since, minutes) {
    const size = Math.max(1, Math.ceil(minutes / 60)) * 60;
    const start = Math.floor(since / size) * size;
    const count = Math.ceil((since + minutes * 60 - start) / size);
    const out = Array.from({ length: count }, (_, i) => ({ at: start + i * size, runs: 0, errors: 0, total_ms: 0, size }));
    for (const point of series) {
        const bin = out[Math.floor((point.bucket - start) / size)];
        if (bin) { bin.runs += point.runs; bin.errors += point.errors; bin.total_ms += point.total_ms; }
    }
    return out;
}

function chart(data, unit) {
    // The bars stretch with the card; the labels are text beside them, which must not.
    const width = 720, height = 150;
    const peak = Math.max(1, ...data.map((d) => d.runs));
    const step = Math.pow(10, Math.floor(Math.log10(peak)));
    const ceiling = Math.ceil(peak / step) * step;
    const scale = (value) => height * (1 - value / ceiling);
    const band = width / data.length;
    const bar = Math.max(1.5, band * 0.68);
    const lines = [0, 0.5, 1].map((part) => `<line class="grid-line" x1="0" x2="${width}" y1="${scale(ceiling * part)}" y2="${scale(ceiling * part)}" vector-effect="non-scaling-stroke"/>`).join('');
    let columns = '';
    data.forEach((d, i) => {
        const x = i * band + (band - bar) / 2;
        const good = d.runs - d.errors;
        const yGood = scale(good), yAll = scale(d.runs);
        const label = `${clock(d.at)}${d.size > 60 ? '–' + clock(d.at + d.size) : ''}`;
        const tip = `<b>${label}</b><br>${int(d.runs)} ${unit}${d.errors ? ' · ' + int(d.errors) + ' failed' : ''}${d.runs ? '<br>' + ms(d.total_ms / d.runs) + ' average' : ''}`;
        columns += `<g class="col" data-tip="${esc(tip)}" data-x="${(x + bar / 2) / width}"><rect class="hit" x="${i * band}" y="0" width="${band}" height="${height}"/>`
            + (good > 0 ? `<rect class="ok" x="${x}" y="${yGood}" width="${bar}" height="${Math.max(1, height - yGood)}"/>` : '')
            + (d.errors > 0 ? `<rect class="err" x="${x}" y="${yAll}" width="${bar}" height="${Math.max(1.5, yGood - yAll)}"/>` : '')
            + '</g>';
    });
    const amount = (value) => value >= 1000 ? (value / 1000) + 'k' : String(Math.round(value));
    return `<div class="chart"><div class="y"><span>${amount(ceiling)}</span><span>${ceiling >= 2 ? amount(ceiling / 2) : ''}</span><span>0</span></div>
        <div class="plot"><svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${lines}${columns}</svg><div class="tip"></div></div>
        <div class="x"><span>${clock(data[0].at)}</span><span>${clock(data[Math.floor(data.length / 2)].at)}</span><span>${clock(data[data.length - 1].at)}</span></div></div>`;
}

function spark(data, key) {
    const values = data.map(key);
    const peak = Math.max(1e-9, ...values);
    const width = 200, height = 34;
    const points = values.map((v, i) => [(i / Math.max(1, values.length - 1)) * width, height - 3 - (v / peak) * (height - 8)]);
    const line = points.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
    return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><path d="${line} L${width} ${height} L0 ${height} Z" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

const empty = (title, text) => `<div class="empty"><b>${title}</b>${text}</div>`;
const card = (title, hint, body, right = '') => `<section class="card"><header><h2>${title}</h2>${hint ? `<span class="hint">${hint}</span>` : ''}${right ? `<span class="right">${right}</span>` : ''}</header>${body}</section>`;
const stat = (label, value, foot, extra = '') => `<section class="card stat"><div class="label">${label}</div><div class="value num">${value}</div><div class="foot">${foot}</div>${extra}</section>`;
const legend = '<span class="legend"><span><i></i>Succeeded</span><span><i class="err"></i>Failed</span></span>';
const routeName = (name) => { const at = name.indexOf(' '); return `<span class="method ${esc(name.slice(0, at))}">${esc(name.slice(0, at))}</span><span class="mono">${esc(name.slice(at + 1))}</span>`; };
const errorCell = (errors, runs) => errors ? `<span class="bad-text num">${int(errors)}</span> <span class="faint num">${pctText(pct(errors, runs))}</span>` : '<span class="faint">–</span>';

function sorted(rows, [key, direction]) {
    return [...rows].sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * direction);
}
function head(table, columns) {
    const [key, direction] = ui.sort[table];
    return '<tr>' + columns.map(([id, label, right]) => id
        ? `<th class="sortable${right ? ' r' : ''}" data-sort="${table}:${id}">${label}<span class="arrow">${key === id ? (direction < 0 ? '↓' : '↑') : ''}</span></th>`
        : `<th${right ? ' class="r"' : ''}>${label}</th>`).join('') + '</tr>';
}

function measuredTable(table, data, nameCell, noun) {
    const rows = sorted(data.rows.filter((row) => !ui.filter || row.name.toLowerCase().includes(ui.filter.toLowerCase())), ui.sort[table]);
    if (data.rows.length === 0) { return ''; }
    const body = rows.map((row) => `<tr class="row"><td class="name">${nameCell(row.name)}</td>
        <td class="r num">${int(row.runs)}<span class="share"><i style="width:${pct(row.runs, data.total)}%"></i></span></td>
        <td class="r num">${ms(row.avg_ms)}</td><td class="r num">${ms(row.max_ms)}</td>
        <td class="r">${errorCell(row.errors, row.runs)}</td><td class="r muted num">${ago(row.last + 60, Math.max(ui.state.now, row.last + 60))}</td></tr>`).join('');
    return `<div class="table-wrap"><table><thead>${head(table, [['name', noun], ['runs', 'Count', 1], ['avg_ms', 'Average', 1], ['max_ms', 'Slowest', 1], ['errors', 'Failed', 1], ['last', 'Last seen', 1]])}</thead><tbody>${body || `<tr><td colspan="6" class="muted">Nothing matches “${esc(ui.filter)}”.</td></tr>`}</tbody></table></div>`;
}

function overview(s) {
    const req = bins(s.requests.series, s.since, s.minutes), jobs = bins(s.jobs.series, s.since, s.minutes);
    const waiting = s.jobs.queues.reduce((sum, q) => sum + q.pending + q.delayed, 0);
    const running = s.jobs.queues.reduce((sum, q) => sum + q.processing, 0);
    const errorRate = pct(s.requests.errors, s.requests.total);
    const slowest = sorted(s.requests.rows.filter((r) => r.runs > 0), ['avg_ms', -1]).slice(0, 6);
    const groups = {};
    for (const worker of s.workers) { (groups[worker.group_name] ??= []).push(worker); }
    return `<div class="grid cards">
        ${stat('Requests', int(s.requests.total), `${(s.requests.total / s.minutes).toFixed(s.requests.total / s.minutes < 10 ? 1 : 0)} a minute`, spark(req, (d) => d.runs))}
        ${stat('Average response', s.requests.total ? ms(s.requests.avg_ms).replace(/ (\w+)$/, '<small>$1</small>') : '–', s.requests.total ? `slowest ${ms(s.requests.max_ms)}` : 'no requests yet', spark(req, (d) => d.runs ? d.total_ms / d.runs : 0))}
        ${stat('Failed requests', `<span class="${errorRate >= 1 ? 'bad-text' : ''}">${pctText(errorRate)}</span>`, `${int(s.requests.errors)} of ${int(s.requests.total)} answered 5xx`, spark(req, (d) => d.errors))}
        ${stat('Jobs', int(s.jobs.total), s.jobs.installed ? `${int(waiting)} pending · ${int(running)} running · <span class="${s.jobs.failed_total ? 'bad-text' : ''}">${int(s.jobs.failed_total)}${s.jobs.failed_more ? '+' : ''} failed for good</span>` : 'no queue registered', spark(jobs, (d) => d.runs))}
    </div>
    <div class="grid two section">
        ${card('Requests', 'by time', `<div class="body">${chart(req, 'requests')}</div>`, legend)}
        ${card('Jobs', 'tries, by time', `<div class="body">${chart(jobs, 'tries')}</div>`, legend)}
    </div>
    <div class="grid three section">
        ${card('Slowest routes', 'by average', slowest.length ? `<ul class="list">${slowest.map((r) => `<li><span class="grow">${routeName(r.name)}</span><span class="num">${ms(r.avg_ms)}</span></li>`).join('')}</ul>` : empty('No requests yet', 'They appear here within a few seconds of being answered.'))}
        ${card('Queues', 'pending now', s.jobs.installed ? `<ul class="list">${s.jobs.queues.map((q) => `<li><span class="grow mono">${esc(q.name)}</span><span class="muted num" style="font-size:12.5px">${q.processing ? int(q.processing) + ' running' : ''}${q.longest_wait >= 60 ? ' · waited ' + span(q.longest_wait) : ''}</span><span class="num ${q.pending + q.delayed > 0 ? '' : 'faint'}" style="min-width:36px;text-align:right">${int(q.pending + q.delayed)}</span></li>`).join('')}</ul>` : empty('No queue', 'Register <code>QueueProvider</code> to see it here.'))}
        ${card('Workers', `${s.workers.length} alive`, Object.keys(groups).length ? `<ul class="list">${Object.entries(groups).map(([group, workers]) => `<li><span class="dot"></span><span class="grow mono">${esc(group)}</span><span class="num">${workers.length}</span><span class="muted num" style="min-width:64px;text-align:right">${bytes(workers.reduce((sum, w) => sum + w.memory, 0))}</span></li>`).join('')}</ul>` : empty('No worker heard from', 'Start <code>php cua serve</code>.'))}
    </div>
    <div class="section">${card('Latest exceptions', '', exceptionRows(s, s.exceptions.slice(0, 5), 'o'), `<a class="btn" href="#exceptions">All ${s.exceptions.length}</a>`)}</div>`;
}

function requests(s) {
    const data = bins(s.requests.series, s.since, s.minutes);
    return `${card('Requests', `${int(s.requests.total)} in all`, `<div class="body">${chart(data, 'requests')}</div>`, legend)}
    <div class="section">${card('Routes', `${s.requests.rows.length}`, measuredTable('requests', s.requests, routeName, 'Route') || empty('No requests yet', 'Every request is counted by its route, within a few seconds of being answered.'), `<input class="search" type="search" placeholder="Filter routes" value="${esc(ui.filter)}" data-filter>`)}</div>`;
}

// What someone deciding about the queue wants first: is it keeping up, and if not, where and why.
function queueVerdict(s, alive) {
    const problems = [];
    // Queues with no worker at all: saying that is enough, without also saying they fall behind.
    const unserved = new Set();
    for (const sup of s.jobs.supervisors) {
        const running = alive['queue:' + sup.name] || 0;
        const waiting = sup.queues.reduce((sum, name) => sum + (s.jobs.queues.find((q) => q.name === name)?.pending ?? 0), 0);
        const stranded = sup.queues.reduce((sum, name) => sum + (s.jobs.queues.find((q) => q.name === name)?.processing ?? 0), 0);
        if (running === 0) { sup.queues.forEach((name) => unserved.add(name)); }
        if (running === 0 && waiting > 0) { problems.push(['bad', `No worker is running for <b>${esc(sup.name)}</b>, and ${int(waiting)} ${waiting === 1 ? 'job waits' : 'jobs wait'} in it. Start <code>php cua serve</code>, or <code>queue:work</code> on its own.`]); }
        else if (running === 0 && stranded > 0) { problems.push(['bad', `No worker is running for <b>${esc(sup.name)}</b>, and ${int(stranded)} ${stranded === 1 ? 'job was' : 'jobs were'} being run when the last one went. ${stranded === 1 ? 'It is' : 'They are'} given out again once a worker is back.`]); }
        else if (running === 0) { problems.push(['warn', `No worker is running for <b>${esc(sup.name)}</b>.`]); }
        else if (running < sup.workers) { problems.push(['warn', `<b>${esc(sup.name)}</b> has ${running} of its ${sup.workers} workers.`]); }
    }
    if (!s.jobs.supervisors.length && !(alive.queue || 0) && s.jobs.queues.some((q) => q.pending > 0 || q.processing > 0)) { problems.push(['bad', 'Jobs are waiting, or were being run when their worker went, and no worker is running. Start <code>php cua serve</code>, or <code>queue:work</code> on its own.']); }
    for (const q of s.jobs.queues) {
        if (q.longest_wait !== null && q.longest_wait >= 60 && !unserved.has(q.name)) { problems.push([q.longest_wait >= 300 ? 'bad' : 'warn', `<b>${esc(q.name)}</b> is falling behind: ${int(q.pending)} pending, and the oldest has waited ${span(q.longest_wait)}. It needs more workers, or its jobs take too long.`]); }
        const tries = q.completed + q.retried + q.failed;
        if (tries >= 10 && (q.retried + q.failed) / tries >= 0.25) { problems.push(['warn', `In <b>${esc(q.name)}</b> ${pctText(pct(q.retried + q.failed, tries))} of tries failed. See which job below.`]); }
    }
    if (s.jobs.failed_total > 0) { problems.push(['warn', `${int(s.jobs.failed_total)}${s.jobs.failed_more ? '+' : ''} ${s.jobs.failed_total === 1 ? 'job has' : 'jobs have'} failed for good and ${s.jobs.failed_total === 1 ? 'waits' : 'wait'} to be retried or forgotten.`]); }
    if (!problems.length) { return `<div class="verdict ok"><span class="dot"></span><div><b>The queue is keeping up.</b> Nothing has waited a minute, and nothing has failed for good.</div></div>`; }
    const worst = problems.some(([level]) => level === 'bad') ? 'bad' : 'warn';
    return `<div class="verdict ${worst}"><span class="dot ${worst === 'bad' ? 'down' : 'paused'}"></span><div>${problems.map(([, text]) => `<div>${text}</div>`).join('')}</div></div>`;
}

function queue(s) {
    if (!s.jobs.installed) { return `<section class="card">${empty('No queue', 'Register <code>QueueProvider</code> before <code>ClockwerkProvider</code> to see jobs here.')}</section>`; }
    const alive = {};
    for (const worker of s.workers) { alive[worker.group_name] = (alive[worker.group_name] || 0) + 1; }
    const single = alive['queue'] || 0;
    const sum = (key) => s.jobs.queues.reduce((total, q) => total + (q[key] || 0), 0);
    const waits = s.jobs.queues.map((q) => q.longest_wait).filter((w) => w !== null);
    const longest = waits.length ? Math.max(...waits) : null;
    const completed = sum('completed'), failedTries = sum('retried') + sum('failed');
    // Which supervisor's workers take from each queue, and how many of them are alive.
    const serving = (name) => {
        const sups = s.jobs.supervisors.filter((sup) => sup.queues.includes(name));
        if (!s.jobs.supervisors.length) { return single ? `<span class="ok-text num">${single}</span>` : '<span class="bad-text">none</span>'; }
        if (!sups.length) { return '<span class="bad-text" title="No supervisor names this queue">none</span>'; }
        const running = sups.reduce((total, sup) => total + (alive['queue:' + sup.name] || 0), 0);
        return `<span class="${running ? '' : 'bad-text'} num">${running}</span> <span class="faint">${esc(sups.map((sup) => sup.name).join(', '))}</span>`;
    };
    const quiet = (n) => n ? int(n) : '<span class="faint">0</span>';
    const queueRows = s.jobs.queues.map((q) => `<tr class="row"><td><span class="mono">${esc(q.name)}</span></td>
        <td class="r num">${q.pending ? `<b>${int(q.pending)}</b>` : quiet(0)}</td><td class="r num">${quiet(q.delayed)}</td><td class="r num">${quiet(q.processing)}</td>
        <td class="r num">${quiet(q.completed)}</td><td class="r num">${q.retried ? `<span style="color:var(--warn)">${int(q.retried)}</span>` : quiet(0)}</td><td class="r num">${q.failed ? `<span class="bad-text">${int(q.failed)}</span>` : quiet(0)}</td>
        <td class="r num">${q.longest_wait === null ? '<span class="faint">–</span>' : `<span class="${q.longest_wait >= 300 ? 'bad-text' : q.longest_wait >= 60 ? '' : 'muted'}" ${q.longest_wait >= 60 && q.longest_wait < 300 ? 'style="color:var(--warn);font-weight:600"' : ''}>${span(q.longest_wait)}</span>`}</td>
        <td class="r num">${q.completed + q.retried + q.failed ? ms(q.avg_ms) : '<span class="faint">–</span>'}</td><td class="r">${serving(q.name)}</td></tr>`).join('');
    const supervisors = s.jobs.supervisors.map((sup) => {
        const running = alive['queue:' + sup.name] || 0;
        const state = running >= sup.workers ? 'ok' : running > 0 ? 'warn' : 'bad';
        return `<section class="card sup"><h3>${esc(sup.name)}<span class="pill ${state}">${running} of ${sup.workers} ${sup.workers === 1 ? 'worker' : 'workers'}</span></h3>
            <div>${sup.queues.map((q) => `<span class="chip">${esc(q)}</span>`).join('')}</div>
            <div class="meta"><span>Jobs at once <b>${running * sup.concurrency}</b></span><span>Concurrency <b>${sup.concurrency}</b></span><span>Tries <b>${sup.tries}</b></span></div></section>`;
    }).join('');

    const outcome = { completed: ['ok', 'Completed'], retrying: ['warn', 'Will retry'], failed: ['bad', 'Failed'] };
    const shown = s.jobs.recent.filter((job) => ui.jobFilter === 'all' || job.outcome === ui.jobFilter);
    const recent = shown.slice(0, ui.shown.recent).map((job, i) => {
        const key = 'j' + job.id + ':' + job.attempts + ':' + i, open = ui.open.has(key);
        return `<tr class="row expandable" data-open="${esc(key)}"><td class="name"><span class="mono" title="${esc(job.job)}">${esc(short(job.job))}</span>${job.error ? `<div class="muted" style="font-size:12.5px">${esc(job.error.slice(0, 110))}</div>` : ''}</td>
            <td><span class="chip">${esc(job.queue)}</span></td><td><span class="pill ${outcome[job.outcome]?.[0] || ''}">${outcome[job.outcome]?.[1] || esc(job.outcome)}</span></td>
            <td class="r num">${job.attempts}</td><td class="r num">${ms(job.ms)}</td><td class="r muted num">${ago(job.at, s.now)}</td></tr>`
            + (open ? `<tr class="detail"><td colspan="6"><dl class="kv"><dt>Job</dt><dd class="mono">${esc(job.job)}</dd><dt>Id</dt><dd class="mono">${esc(job.id)}</dd><dt>Queue</dt><dd class="mono">${esc(job.queue)}</dd><dt>Try</dt><dd>${job.attempts}</dd><dt>Took</dt><dd>${ms(job.ms)}</dd><dt>Ended</dt><dd>${stamp(job.at)}</dd>${job.error ? `<dt>Error</dt><dd>${esc(job.error)}</dd>` : ''}</dl></td></tr>` : '');
    }).join('');
    const failed = s.jobs.failed.slice(0, ui.shown.failed).map((job) => {
        const key = 'f' + job.id, open = ui.open.has(key);
        return `<tr class="row expandable" data-open="${esc(key)}"><td class="name"><span class="mono">${esc(short(job.job))}</span><div class="muted" style="font-size:12.5px">${esc((job.error || '').slice(0, 110))}</div></td>
            <td><span class="chip">${esc(job.queue)}</span></td><td class="r num">${job.attempts}</td><td class="r muted num">${ago(job.failed_at, s.now)}</td>
            <td class="r"><button class="btn" data-job="retry:${esc(job.id)}">Retry</button> <button class="btn danger" data-job="forget:${esc(job.id)}">Forget</button></td></tr>`
            + (open ? `<tr class="detail"><td colspan="5"><dl class="kv"><dt>Job</dt><dd class="mono">${esc(job.job)}</dd><dt>Id</dt><dd class="mono">${esc(job.id)}</dd><dt>Failed</dt><dd>${job.failed_at ? stamp(job.failed_at) : ''}</dd><dt>Error</dt><dd>${esc(job.error)}</dd></dl><pre>${esc(JSON.stringify(job.data, null, 2))}</pre></td></tr>` : '');
    }).join('');
    const actions = s.jobs.failed_total ? `<button class="btn" data-job="retry:all">Retry all</button><button class="btn danger" data-job="forget:all">Forget all</button>` : '';
    const tabs = `<div class="seg">${[['recent', 'Recent'], ['failed', `Failed for good${s.jobs.failed_total ? ' · ' + int(s.jobs.failed_total) + (s.jobs.failed_more ? '+' : '') : ''}`]].map(([id, label]) => `<button data-tab="${id}" class="${ui.jobTab === id ? 'on' : ''}">${label}</button>`).join('')}</div>`;
    const filters = `<div class="seg">${[['all', 'All'], ['completed', 'Completed'], ['retrying', 'Will retry'], ['failed', 'Failed']].map(([id, label]) => `<button data-job-filter="${id}" class="${ui.jobFilter === id ? 'on' : ''}">${label}</button>`).join('')}</div>`;
    const list = ui.jobTab === 'failed'
        ? card('Jobs', 'given up on, kept until retried or forgotten', failed ? `<div class="table-wrap"><table><thead><tr><th>Job</th><th>Queue</th><th class="r">Tries</th><th class="r">Failed</th><th></th></tr></thead><tbody>${failed}</tbody></table></div>${more('failed', s.jobs.failed.length)}` : empty('Nothing has failed for good', 'A job that runs out of tries is kept here until you retry or forget it.'), actions + tabs)
        : card('Jobs', 'the latest tries', recent ? `<div class="table-wrap"><table><thead><tr><th>Job</th><th>Queue</th><th>Outcome</th><th class="r">Try</th><th class="r">Took</th><th class="r">Ended</th></tr></thead><tbody>${recent}</tbody></table></div>${more('recent', shown.length)}` : empty(s.jobs.recent.length ? 'None of these lately' : 'No job has run yet', s.jobs.recent.length ? 'Choose another outcome.' : 'Each try of a job is listed here as it ends. This needs <code>EventsProvider</code> registered before <code>QueueProvider</code>.'), filters + tabs);

    return `${queueVerdict(s, alive)}
    <div class="grid cards">
        ${stat('Pending', int(sum('pending')), sum('delayed') ? `${int(sum('delayed'))} more delayed` : 'waiting for a worker now')}
        ${stat('Processing', int(sum('processing')), 'being run now')}
        ${stat('Completed', int(completed), `${(completed / s.minutes).toFixed(completed / s.minutes < 10 ? 1 : 0)} a minute`)}
        ${stat('Failed', `<span class="${sum('failed') ? 'bad-text' : ''}">${int(sum('failed'))}</span>`, `${int(sum('retried'))} more tries failed and were retried`)}
    </div>
    <div class="section">${card('Queues', longest === null ? 'nothing waiting' : `longest wait ${span(longest)}`, `<div class="table-wrap"><table><thead><tr><th>Queue</th><th class="r" title="May be taken by a worker now">Pending</th><th class="r" title="Waiting for their time">Delayed</th><th class="r" title="Taken by a worker, not yet reported on">Processing</th><th class="r">Completed</th><th class="r" title="Tries that failed and were tried again">Retried</th><th class="r" title="Given up on">Failed</th><th class="r" title="How long the oldest pending job has waited">Longest wait</th><th class="r">Avg time</th><th class="r">Workers</th></tr></thead><tbody>${queueRows}</tbody></table></div>`)}</div>
    ${supervisors ? `<div class="grid three section">${supervisors}</div>` : ''}
    <div class="section">${card('Throughput', 'tries, by time', `<div class="body">${chart(bins(s.jobs.series, s.since, s.minutes), 'tries')}</div>`, legend)}</div>
    <div class="section">${card('By job', `${int(s.jobs.total)} tries: which are slow, which fail`, measuredTable('jobs', s.jobs, (name) => `<span class="mono" title="${esc(name)}">${esc(short(name))}</span>`, 'Job') || empty('No job has run yet', 'A job is counted each time a worker tries it. This needs <code>EventsProvider</code> registered before <code>QueueProvider</code>.'))}</div>
    <div class="section">${list}</div>`;
}

function schedule(s) {
    if (!s.tasks.installed) { return `<section class="card">${empty('No schedule', 'Register <code>ScheduleProvider</code> before <code>ClockwerkProvider</code> to see scheduled tasks here.')}</section>`; }
    if (!s.tasks.rows.length) { return `<section class="card">${empty('Nothing is scheduled', 'Declare tasks on <code>Schedule</code> in a provider’s <code>register()</code>.')}</section>`; }
    const running = s.workers.some((w) => w.group_name === 'schedule');
    const rows = s.tasks.rows.map((task) => {
        const state = task.runs === 0 ? ['', 'Not run yet'] : task.errors === 0 ? ['ok', 'Running well'] : task.errors === task.runs ? ['bad', 'Failing'] : ['warn', `${task.errors} failed`];
        return `<tr class="row"><td class="name"><span class="mono">${esc(task.name)}</span>${task.one_server ? ' <span class="chip">one server</span>' : ''}</td>
            <td><span class="chip">${esc(task.when)}</span></td>
            <td class="muted num">${task.next ? `${until(task.next, s.now)} <span class="faint">· ${stamp(task.next).replace(/:\d\d(?!.*:\d\d)/, '')}</span>` : 'while the scheduler runs'}</td>
            <td class="r num">${int(task.runs)}</td><td class="r num">${task.runs ? ms(task.avg_ms) : '<span class="faint">–</span>'}</td>
            <td class="r muted num">${task.last ? ago(task.last + 60, Math.max(s.now, task.last + 60)) : '<span class="faint">–</span>'}</td>
            <td class="r"><span class="pill ${state[0]}">${state[1]}</span></td></tr>`;
    }).join('');
    return `${running ? '' : '<div class="banner">No scheduler is running, so nothing here will run. Start <code>php cua serve</code>, or <code>schedule:work</code> on its own.</div>'}
    ${card('Scheduled tasks', `${s.tasks.rows.length}`, `<div class="table-wrap"><table><thead><tr><th>Task</th><th>When</th><th>Next run</th><th class="r">Runs</th><th class="r">Average</th><th class="r">Last run</th><th class="r">State</th></tr></thead><tbody>${rows}</tbody></table></div>`)}`;
}

function workers(s) {
    if (!s.workers.length) { return `<section class="card">${empty('No worker heard from', 'A worker reports every few seconds once <code>php cua serve</code>, <code>queue:work</code> or <code>schedule:work</code> is running.')}</section>`; }
    const groups = {};
    for (const worker of s.workers) { (groups[worker.group_name] ??= []).push(worker); }
    return Object.entries(groups).map(([group, list], index) => `<div class="${index ? 'section' : ''}">${card(esc(group), `${list.length} ${list.length === 1 ? 'process' : 'processes'}`, `<div class="table-wrap"><table><thead><tr><th>Process</th><th>Host</th><th class="r">Up for</th><th class="r">Memory</th><th class="r">Handled</th><th class="r">Heard from</th></tr></thead><tbody>${list.map((w) => `<tr class="row"><td><span class="dot" style="display:inline-block;margin-right:10px"></span><span class="mono">${w.pid}</span></td><td class="muted">${esc(w.host)}</td><td class="r num">${span(s.now - w.started_at)}</td><td class="r num">${bytes(w.memory)}</td><td class="r num">${int(w.handled)}</td><td class="r muted num">${ago(w.seen_at, s.now)}</td></tr>`).join('')}</tbody></table></div>`)}</div>`).join('');
}

function exceptionRows(s, list, prefix) {
    if (!list.length) { return empty('No exceptions', 'What a request, a job or a task throws is kept here with where it came from.'); }
    return `<div class="table-wrap"><table><tbody>${list.map((e, i) => {
        const key = prefix + e.at + ':' + i, open = ui.open.has(key), d = e.detail || {};
        return `<tr class="row expandable" data-open="${esc(key)}"><td class="name"><span class="bad-text mono">${esc(short(d.class || 'Error'))}</span> <span>${esc((d.message ?? e.title).slice(0, 160))}</span><div class="muted" style="font-size:12.5px">${esc(d.during || '')}</div></td><td class="r muted num">${ago(e.at, s.now)}</td></tr>`
            + (open ? `<tr class="detail"><td colspan="2"><dl class="kv"><dt>Exception</dt><dd class="mono">${esc(d.class)}</dd><dt>Message</dt><dd>${esc(d.message)}</dd><dt>Thrown at</dt><dd class="mono">${esc(d.file)}:${esc(d.line)}</dd><dt>During</dt><dd>${esc(d.during)}</dd><dt>When</dt><dd>${stamp(e.at)}</dd></dl><pre>${(d.trace || []).map((line, n) => `<b>#${n}</b> ${esc(line)}`).join('\n')}</pre></td></tr>` : '');
    }).join('')}</tbody></table></div>`;
}

function gate() {
    if (ui.closed) { return `<div class="card gate"><h2>The dashboard is closed</h2><p class="muted">${esc(ui.error).replace(/\n+/g, '<br>')}</p></div>`; }
    return `<div class="card gate"><h2>The dashboard needs its token</h2><p class="muted">It is the secret in <code>clockwerk.token</code>.${token ? ' The one this tab has was not accepted.' : ''}</p><form data-token><input class="search" type="password" placeholder="Token" autofocus><button class="btn primary">Open</button></form></div>`;
}

const more = (list, total) => total > ui.shown[list] ? `<div style="padding:10px 16px 14px;text-align:center;border-top:1px solid var(--line-soft)"><button class="btn" data-more="${list}">Show ${Math.min(25, total - ui.shown[list])} more</button> <span class="muted" style="margin-left:8px;font-size:12.5px">${ui.shown[list]} of ${total} shown</span></div>` : '';
const views = { overview, requests, queue, schedule, workers, exceptions: (s) => card('Exceptions', `${s.exceptions.length}${s.exceptions.length >= 200 ? ', the latest' : ''}`, exceptionRows(s, s.exceptions.slice(0, ui.shown.exceptions), 'e') + more('exceptions', s.exceptions.length)) };

function render() {
    const app = document.getElementById('app');
    if (ui.gate) { app.innerHTML = gate(); return; }
    const s = ui.state;
    if (!s) { app.innerHTML = `<div class="empty" style="padding-top:20vh">${ui.error ? `<b>The dashboard could not be reached</b>${esc(ui.error)}` : 'Loading…'}</div>`; return; }
    document.title = `${s.app} · Clockwerk`;
    const counts = { queue: s.jobs.failed_total, exceptions: s.exceptions.length };
    const [, title] = pages.find(([id]) => id === ui.page);
    const keep = document.activeElement?.matches?.('[data-filter]') ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    const scroll = window.scrollY;
    app.innerHTML = `<div class="shell">
        <aside class="side">
            <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="var(--accent)"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="6.5"/><path d="M16 12.5V16l2.4 1.6"/><path d="M16 5.5v2.2M16 24.3v2.2M5.5 16h2.2M24.3 16h2.2M8.6 8.6l1.6 1.6M21.8 21.8l1.6 1.6M8.6 23.4l1.6-1.6M21.8 10.2l1.6-1.6"/></g></svg><div><b>Clockwerk</b><span title="${esc(s.app)}">${esc(s.app)}</span></div></div>
            <nav class="nav">${pages.map(([id, label, icon]) => `<a href="#${id}" class="${id === ui.page ? 'on' : ''}" title="${label}"><svg viewBox="0 0 24 24">${icon}</svg><span class="label">${label}</span>${counts[id] ? `<span class="count ${id === 'queue' || id === 'exceptions' ? 'bad' : ''}">${counts[id] > 99 ? '99+' : counts[id]}</span>` : ''}</a>`).join('')}</nav>
            <div class="side-foot"><div class="live"><span class="dot ${ui.error ? 'down' : ui.paused ? 'paused' : 'pulse'}"></span><span>${ui.error ? 'Not reachable' : ui.paused ? 'Paused' : 'Live'}</span><span class="when faint" style="margin-left:auto">${clock(s.now)}</span></div></div>
        </aside>
        <main class="main">
            <div class="top"><h1>${title}</h1><span class="sub">the last ${ranges.find(([m]) => m === s.minutes)?.[1] ?? s.minutes + 'm'}</span><span class="spacer"></span>
                <div class="seg">${ranges.map(([m, label]) => `<button data-range="${m}" class="${m === ui.minutes ? 'on' : ''}">${label}</button>`).join('')}</div>
                <button class="icon-btn" data-pause title="${ui.paused ? 'Resume' : 'Pause'}"><svg viewBox="0 0 24 24">${ui.paused ? '<path d="M7 5l12 7-12 7z"/>' : '<path d="M8 5v14M16 5v14"/>'}</svg></button>
                <button class="icon-btn" data-theme-toggle title="Light or dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
            </div>
            ${ui.error ? `<div class="banner">${esc(ui.error)} Showing what was last received.</div>` : ''}
            ${views[ui.page](s)}
        </main>
    </div>${ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : ''}`;
    window.scrollTo(0, scroll);
    if (keep) { const input = app.querySelector('[data-filter]'); input?.focus(); input?.setSelectionRange(keep[0], keep[1]); }
}

function toast(text) {
    ui.toast = text;
    render();
    setTimeout(() => { if (ui.toast === text) { ui.toast = null; render(); } }, 2600);
}

document.addEventListener('click', async (event) => {
    const target = event.target.closest('[data-range], [data-pause], [data-theme-toggle], [data-sort], [data-job], [data-more], [data-tab], [data-job-filter], [data-open]');
    if (!target) { return; }
    if (target.dataset.tab) { ui.jobTab = target.dataset.tab; render(); return; }
    if (target.dataset.jobFilter) { ui.jobFilter = target.dataset.jobFilter; ui.shown.recent = 25; render(); return; }
    if (target.dataset.more) { ui.shown[target.dataset.more] += 25; render(); return; }
    if (target.dataset.range) { ui.minutes = Number(target.dataset.range); store.set('minutes', ui.minutes); render(); refresh(); return; }
    if ('pause' in target.dataset) { ui.paused = !ui.paused; render(); if (!ui.paused) { refresh(); } return; }
    if ('themeToggle' in target.dataset) {
        const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'light' : 'dark';
        store.set('theme', document.documentElement.dataset.theme);
        return;
    }
    if (target.dataset.sort) {
        const [table, key] = target.dataset.sort.split(':');
        ui.sort[table] = [key, ui.sort[table][0] === key ? -ui.sort[table][1] : (key === 'name' ? 1 : -1)];
        render();
        return;
    }
    if (target.dataset.job) {
        event.stopPropagation();
        const at = target.dataset.job.indexOf(':'), action = target.dataset.job.slice(0, at), id = target.dataset.job.slice(at + 1);
        if (ui.busy || (id === 'all' && !confirm(action === 'retry' ? 'Put every failed job back on its queue?' : 'Delete every failed job? This cannot be undone.'))) { return; }
        ui.busy = true;
        try {
            const result = await call('/api/jobs/' + action, { method: 'POST', body: JSON.stringify({ id }) });
            const count = result.retried ?? result.forgotten ?? 0;
            toast(action === 'retry' ? `${count} ${count === 1 ? 'job' : 'jobs'} put back on the queue` : `${count} ${count === 1 ? 'job' : 'jobs'} forgotten`);
        } catch (error) { toast(error.message); }
        ui.busy = false;
        refresh();
        return;
    }
    if (target.dataset.open && !event.target.closest('button, a')) {
        ui.open.has(target.dataset.open) ? ui.open.delete(target.dataset.open) : ui.open.add(target.dataset.open);
        render();
    }
});
document.addEventListener('input', (event) => { if (event.target.matches('[data-filter]')) { ui.filter = event.target.value; render(); } });
document.addEventListener('submit', (event) => {
    if (!event.target.matches('[data-token]')) { return; }
    event.preventDefault();
    token = event.target.querySelector('input').value;
    try { sessionStorage.setItem('clockwerk.token', token); } catch {}
    refresh();
});
document.addEventListener('mousemove', (event) => {
    const column = event.target.closest?.('.chart g.col');
    for (const tip of document.querySelectorAll('.chart .tip')) {
        const mine = column && tip.parentElement.contains(column);
        tip.style.opacity = mine ? 1 : 0;
        if (mine) {
            tip.innerHTML = column.dataset.tip;
            const box = tip.parentElement.getBoundingClientRect(), half = tip.offsetWidth / 2;
            tip.style.left = Math.min(box.width - half, Math.max(half, Number(column.dataset.x) * box.width)) + 'px';
            tip.style.top = '-4px';
        }
    }
});
window.addEventListener('hashchange', () => {
    const page = location.hash.slice(1);
    if (pages.some(([id]) => id === page)) { ui.page = page; ui.filter = ''; window.scrollTo(0, 0); render(); }
});

refresh();
// While the tab is in view and not paused; a chart being read is not redrawn under the pointer.
setInterval(() => {
    if (!ui.paused && !ui.gate && !document.hidden && !document.querySelector('.chart g.col:hover') && !ui.busy) { refresh(); }
}, 5000);
})();
</script>
</body>
</html>
