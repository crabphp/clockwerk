name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        framework: ['v0.6.3', 'main']
    defaults:
      run:
        working-directory: clockwerk
    steps:
      - uses: actions/checkout@v4
        with:
          path: clockwerk
      # Composer reads the released framework or main from the sibling path repository.
      - uses: actions/checkout@v4
        with:
          repository: crabphp/framework
          ref: ${{ matrix.framework }}
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer format:check
      - run: composer lint
      - run: composer test -- --fail-on-skipped
